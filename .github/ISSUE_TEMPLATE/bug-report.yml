name: Bug Report
description: Report a bug with an animation or the landing page
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: animation
    attributes:
      label: Which animation?
      description: Name of the animation, or "Landing page" if it's a site issue.
      placeholder: e.g. VLA Model Explainer
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 120 on macOS 14
