<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embodied AI Visuals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg: #0d1117;
    --color-surface: #161b22;
    --color-surface-hover: #1c2333;
    --color-border: #30363d;
    --color-text-primary: #e6edf3;
    --color-text-secondary: #8b949e;
    --color-accent: #58a6ff;
    --color-accent-subtle: rgba(88, 166, 255, 0.1);
    /* Mapped for animation files */
    --color-border-secondary: #30363d;
    --color-border-tertiary: #21262d;
    --color-background-secondary: #1c2333;
    --color-text-tertiary: #6e7681;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--color-border);
    padding: 32px 24px;
    text-align: center;
  }

  header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  header p {
    color: var(--color-text-secondary);
    font-size: 16px;
    max-width: 520px;
    margin: 0 auto;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .card:hover {
    border-color: var(--color-accent);
    transform: translateY(-2px);
  }

  .card-body {
    padding: 20px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--color-text-secondary);
    line-height: 1.5;
  }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    background: var(--color-accent-subtle);
    color: var(--color-accent);
    margin-top: 12px;
  }

  /* Overlay viewer */
  .viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .viewer-overlay.active { display: flex; }

  .viewer-container {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 16px;
    width: 100%;
    max-width: 960px;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
  }

  .viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    background: var(--color-surface);
    z-index: 1;
  }

  .viewer-title {
    font-size: 15px;
    font-weight: 600;
  }

  .viewer-close {
    background: none;
    border: none;
    color: var(--color-text-secondary);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
  }

  .viewer-close:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

  .viewer-content {
    padding: 32px 40px;
  }

  footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--color-text-secondary);
    font-size: 13px;
    border-top: 1px solid var(--color-border);
  }

  footer a { color: var(--color-accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Embodied AI Visuals</h1>
  <p>Interactive animations explaining core concepts in robotics and embodied intelligence.</p>
</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<div class="viewer-overlay" id="viewer" onclick="if(event.target===this)closeViewer()">
  <div class="viewer-container">
    <div class="viewer-header">
      <span class="viewer-title" id="viewer-title"></span>
      <button class="viewer-close" onclick="closeViewer()">&times;</button>
    </div>
    <div class="viewer-content" id="viewer-content"></div>
  </div>
</div>

<footer>
  Built for learning &mdash; <a href="https://github.com">View on GitHub</a>
</footer>

<script>
/**
 * Animation registry.
 * To add a new animation, just add an entry here and drop the .html file in animations/.
 */
const ANIMATIONS = [
  {
    id: 'vla_model_explainer',
    title: 'VLA Model Explainer',
    description: 'Step-by-step walkthrough of Vision-Language-Action models — from camera input to robot action output.',
    tag: 'VLA',
  },
  // Add more entries here:
  // {
  //   id: 'filename_without_extension',
  //   title: 'Display Title',
  //   description: 'Short description of what this animation teaches.',
  //   tag: 'Category',
  // },
];

const gallery = document.getElementById('gallery');

ANIMATIONS.forEach(anim => {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openViewer(anim);
  card.innerHTML = `
    <div class="card-body">
      <div class="card-title">${anim.title}</div>
      <div class="card-desc">${anim.description}</div>
      <span class="card-tag">${anim.tag}</span>
    </div>
  `;
  gallery.appendChild(card);
});

function openViewer(anim) {
  document.getElementById('viewer-title').textContent = anim.title;
  const content = document.getElementById('viewer-content');
  content.innerHTML = '<p style="color:var(--color-text-secondary)">Loading...</p>';
  document.getElementById('viewer').classList.add('active');
  document.body.style.overflow = 'hidden';

  fetch(`animations/${anim.id}.html`)
    .then(r => r.text())
    .then(html => {
      content.innerHTML = html;
      // Execute any <script> tags in the loaded content
      content.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        oldScript.replaceWith(newScript);
      });
    })
    .catch(() => {
      content.innerHTML = '<p style="color:#f85149">Failed to load animation.</p>';
    });
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('active');
  document.body.style.overflow = '';
  // Clear content to stop any running animations/intervals
  document.getElementById('viewer-content').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});
</script>

</body>
</html>
