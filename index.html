<html lang="en">
<head>

<meta name="description" content="Interactive animations explaining core concepts in robotics and embodied intelligence — VLAs, reinforcement learning, SLAM, and more.">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg: #0d1117;
    --color-surface: #161b22;
    --color-surface-hover: #1c2333;
    --color-border: #30363d;
    --color-text-primary: #e6edf3;
    --color-text-secondary: #8b949e;
    --color-text-tertiary: #6e7681;
    --color-accent: #58a6ff;
    --color-accent-subtle: rgba(88, 166, 255, 0.1);
    /* Mapped for animation files */
    --color-border-secondary: #30363d;
    --color-border-tertiary: #21262d;
    --color-background-secondary: #1c2333;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    border-bottom: 1px solid var(--color-border);
    padding: 64px 24px 56px;
    text-align: center;
    overflow: hidden;
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.35;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.8px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #e6edf3, #58a6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--color-text-secondary);
    font-size: 17px;
    max-width: 560px;
    margin: 0 auto 24px;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 20px;
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--color-accent);
  }

  .hero-stat-label {
    font-size: 12px;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── Filter bar ── */
  .filter-bar {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 13px;
    color: var(--color-text-tertiary);
    margin-right: 4px;
  }

  .filter-btn {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .filter-btn:hover {
    border-color: var(--color-accent);
    color: var(--color-text-primary);
  }

  .filter-btn.active {
    background: var(--color-accent-subtle);
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  /* ── Gallery ── */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 24px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--color-border-tertiary);
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .card:hover {
    border-color: var(--color-accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  .card-preview {
    height: 140px;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .card-preview svg {
    width: 100%;
    height: 100%;
  }

  .card-body {
    padding: 18px 20px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--color-text-secondary);
    line-height: 1.5;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--color-accent-subtle);
    color: var(--color-accent);
  }

  .card-embed {
    font-size: 11px;
    color: var(--color-text-tertiary);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .card-embed:hover {
    color: var(--color-accent);
    background: var(--color-accent-subtle);
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 24px;
    color: var(--color-text-tertiary);
    font-size: 15px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text-primary);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 2000;
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* ── Overlay viewer ── */
  .viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 16px;
    backdrop-filter: blur(4px);
  }

  .viewer-overlay.active { display: flex; }

  .viewer-container {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 16px;
    width: 100%;
    max-width: 960px;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
    animation: viewerIn 0.25s ease;
  }

  @keyframes viewerIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    background: var(--color-surface);
    z-index: 1;
  }

  .viewer-title {
    font-size: 15px;
    font-weight: 600;
  }

  .viewer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .viewer-btn {
    background: none;
    border: 1px solid var(--color-border);
    color: var(--color-text-secondary);
    font-size: 12px;
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: inherit;
    transition: all 0.15s;
  }

  .viewer-btn:hover {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .viewer-close {
    background: none;
    border: none;
    color: var(--color-text-secondary);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
  }

  .viewer-close:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

  .viewer-content {
    padding: 0;
  }

  .viewer-content iframe {
    display: block;
    width: 100%;
    height: 70vh;
    border: none;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--color-text-secondary);
    font-size: 13px;
    border-top: 1px solid var(--color-border);
  }

  footer a { color: var(--color-accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .hero { padding: 40px 16px 36px; }
    .hero h1 { font-size: 26px; }
    .hero p { font-size: 15px; }
    .hero-stats { gap: 20px; }
    .gallery { grid-template-columns: 1fr; }
    .viewer-content { padding: 20px 16px; }
    .filter-bar { padding: 16px 16px 0; }
    main { padding: 16px 16px 40px; }
  }
</style>
</head>
<body>

<!-- Hero with animated background -->
<header class="hero">
  <canvas id="hero-canvas"></canvas>
  <div class="hero-content">
    <h1>Embodied AI Visuals</h1>
    <p>Interactive animations explaining core concepts in robotics and embodied intelligence.</p>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="hero-stat-num" id="stat-count">0</div>
        <div class="hero-stat-label">Animations</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-num" id="stat-topics">0</div>
        <div class="hero-stat-label">Topics</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-num">100%</div>
        <div class="hero-stat-label">Browser-based</div>
      </div>
    </div>
  </div>
</header>

<!-- Filter bar -->
<div class="filter-bar" id="filter-bar">
  <span class="filter-label">Filter:</span>
</div>

<!-- Gallery -->
<main>
  <div id="gallery-container"></div>
</main>

<!-- Viewer overlay -->
<div class="viewer-overlay" id="viewer" onclick="if(event.target===this)closeViewer()">
  <div class="viewer-container">
    <div class="viewer-header">
      <span class="viewer-title" id="viewer-title"></span>
      <div class="viewer-actions">
        <button class="viewer-btn" id="viewer-embed-btn" onclick="copyEmbed(event)">Copy embed</button>
        <button class="viewer-close" onclick="closeViewer()">&times;</button>
      </div>
    </div>
    <div class="viewer-content" id="viewer-content"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<footer>
  Built for learning &mdash; <a href="https://github.com/arpitg1304/embodied-ai-visuals" target="_blank">View on GitHub</a> &mdash; <a href="https://github.com/arpitg1304/embodied-ai-visuals/blob/main/CONTRIBUTING.md" target="_blank">Contribute</a>
</footer>

<script>
/* ── Animation registry ── */
const ANIMATIONS = [
  {
    id: 'vla_model_explainer',
    title: 'VLA Model Explainer',
    description: 'Step-by-step walkthrough of Vision-Language-Action models — from camera input to robot action output.',
    tag: 'VLA',
    category: 'Perception',
  },
  {
    id: 'sim2real_gap_explainer',
    title: 'Sim-to-Real Gap Explainer',
    description: 'Why policies trained in simulation fail in the real world — visual gaps, physics mismatch, sensor noise — and how domain randomization bridges them.',
    tag: 'Sim2Real',
    category: 'Learning',
  },
  {
    id: 'reward_shaping_explainer',
    title: 'Reward Shaping — Sparse vs Dense',
    description: 'How reward function design shapes learning — sparse rewards, dense gradients, reward hacking, and potential-based shaping.',
    tag: 'RL',
    category: 'Learning',
  },
  // To add a new animation:
  // 1. Drop a .html file in animations/
  // 2. Add an entry here with: id (filename without .html), title, description, tag, category
];

/* ── Card preview SVGs (mini visuals per animation) ── */
const PREVIEWS = {
  vla_model_explainer: `<svg viewBox="0 0 320 140" fill="none">
    <rect x="20" y="30" width="60" height="50" rx="4" fill="#1D9E75" opacity="0.2" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="50" y="60" text-anchor="middle" font-size="10" fill="#1D9E75">IMG</text>
    <rect x="100" y="30" width="60" height="50" rx="4" fill="#534AB7" opacity="0.2" stroke="#534AB7" stroke-width="0.5"/>
    <text x="130" y="60" text-anchor="middle" font-size="10" fill="#534AB7">TXT</text>
    <line x1="170" y1="55" x2="195" y2="55" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="200" y="25" width="100" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="250" y="50" text-anchor="middle" font-size="9" fill="#8b949e">Transformer</text>
    <text x="250" y="65" text-anchor="middle" font-size="8" fill="#6e7681">32 layers</text>
    <line x1="250" y1="90" x2="250" y2="110" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="250" y="125" text-anchor="middle" font-size="10" fill="#D85A30">7-DoF Action</text>
  </svg>`,
  sim2real_gap_explainer: `<svg viewBox="0 0 320 140" fill="none">
    <rect x="20" y="20" width="120" height="90" rx="6" fill="#E8F4FD" stroke="#B5D4F4" stroke-width="0.5"/>
    <text x="80" y="38" text-anchor="middle" font-size="9" fill="#0C447C" font-weight="500">SIM</text>
    <rect x="55" y="70" width="30" height="24" rx="2" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
    <text x="160" y="70" text-anchor="middle" font-size="18" fill="#6e7681">&ne;</text>
    <rect x="180" y="20" width="120" height="90" rx="6" fill="#FDF4E8" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="240" y="38" text-anchor="middle" font-size="9" fill="#633806" font-weight="500">REAL</text>
    <rect x="215" y="70" width="30" height="24" rx="2" fill="#8B6E4E" stroke="#633806" stroke-width="0.5"/>
    <text x="160" y="130" text-anchor="middle" font-size="9" fill="#8b949e">Domain Randomization</text>
  </svg>`,
  reward_shaping_explainer: `<svg viewBox="0 0 320 140" fill="none">
    <rect x="20" y="25" width="130" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="85" y="42" text-anchor="middle" font-size="9" fill="#8b949e">Sparse Reward</text>
    <line x1="30" y1="95" x2="140" y2="95" stroke="#30363d" stroke-width="0.5"/>
    <line x1="30" y1="55" x2="30" y2="95" stroke="#30363d" stroke-width="0.5"/>
    <line x1="130" y1="95" x2="130" y2="65" stroke="#3B6D11" stroke-width="2"/>
    <circle cx="130" cy="65" r="3" fill="#3B6D11"/>
    <rect x="170" y="25" width="130" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="235" y="42" text-anchor="middle" font-size="9" fill="#8b949e">Dense Reward</text>
    <line x1="180" y1="95" x2="290" y2="95" stroke="#30363d" stroke-width="0.5"/>
    <line x1="180" y1="55" x2="180" y2="95" stroke="#30363d" stroke-width="0.5"/>
    <path d="M180 90 Q210 85 230 75 Q260 60 290 55" fill="none" stroke="#534AB7" stroke-width="2"/>
    <text x="160" y="130" text-anchor="middle" font-size="9" fill="#8b949e">Reward Shaping</text>
  </svg>`,
};

/* ── Derive categories and tags ── */
const categories = [...new Set(ANIMATIONS.map(a => a.category))].sort();
const tags = ['All', ...new Set(ANIMATIONS.map(a => a.tag))];

document.getElementById('stat-count').textContent = ANIMATIONS.length;
document.getElementById('stat-topics').textContent = tags.length - 1; // exclude 'All'

/* ── Filter bar ── */
let activeFilter = 'All';
const filterBar = document.getElementById('filter-bar');

tags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (tag === 'All' ? ' active' : '');
  btn.textContent = tag;
  btn.onclick = () => {
    activeFilter = tag;
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery();
  };
  filterBar.appendChild(btn);
});

/* ── Render gallery ── */
function renderGallery() {
  const container = document.getElementById('gallery-container');
  container.innerHTML = '';

  const filtered = activeFilter === 'All'
    ? ANIMATIONS
    : ANIMATIONS.filter(a => a.tag === activeFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="gallery"><div class="no-results">No animations match this filter.</div></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'gallery';

  filtered.forEach(anim => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = (e) => {
      if (e.target.closest('.card-embed')) return;
      openViewer(anim);
    };
    card.innerHTML = `
      <div class="card-preview">${PREVIEWS[anim.id] || defaultPreview(anim)}</div>
      <div class="card-body">
        <div class="card-title">${anim.title}</div>
        <div class="card-desc">${anim.description}</div>
        <div class="card-footer">
          <span class="card-tag">${anim.tag}</span>
          <button class="card-embed" onclick="copyEmbedFor('${anim.id}', event)" title="Copy iframe embed code">&lt;/&gt; Embed</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

function defaultPreview(anim) {
  return `<svg viewBox="0 0 320 140" fill="none">
    <circle cx="160" cy="60" r="30" fill="var(--color-accent-subtle)" stroke="var(--color-accent)" stroke-width="0.5"/>
    <text x="160" y="64" text-anchor="middle" font-size="11" fill="var(--color-accent)">${anim.tag}</text>
    <text x="160" y="110" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">Click to view</text>
  </svg>`;
}

renderGallery();

/* ── Viewer ── */
let currentAnim = null;

function openViewer(anim) {
  currentAnim = anim;
  document.getElementById('viewer-title').textContent = anim.title;
  const content = document.getElementById('viewer-content');
  // Use an iframe so each load gets a fresh JS execution context
  content.innerHTML = `<iframe src="animations/${anim.id}.html"></iframe>`;
  document.getElementById('viewer').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('active');
  document.body.style.overflow = '';
  // Remove the iframe to stop animations and free memory
  document.getElementById('viewer-content').innerHTML = '';
  currentAnim = null;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});

/* ── Embed copy ── */
function getEmbedCode(id) {
  return `<iframe src="https://arpitg1304.github.io/embodied-ai-visuals/animations/${id}.html" width="100%" height="400" frameborder="0" style="border-radius:12px;border:1px solid #30363d"></iframe>`;
}

function copyEmbedFor(id, e) {
  e.stopPropagation();
  navigator.clipboard.writeText(getEmbedCode(id)).then(() => showToast('Embed code copied!'));
}

function copyEmbed(e) {
  e.stopPropagation();
  if (!currentAnim) return;
  navigator.clipboard.writeText(getEmbedCode(currentAnim.id)).then(() => showToast('Embed code copied!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ── Hero canvas animation — floating network nodes ── */
(function() {
  const canvas = document.getElementById('hero-canvas');
  const ctx = canvas.getContext('2d');
  let nodes = [];
  const NODE_COUNT = 40;
  const CONNECT_DIST = 120;

  function resize() {
    canvas.width = canvas.offsetWidth * devicePixelRatio;
    canvas.height = canvas.offsetHeight * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
  }

  function init() {
    resize();
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    nodes = Array.from({ length: NODE_COUNT }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 2 + 1.5,
    }));
  }

  function draw() {
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    ctx.clearRect(0, 0, w, h);

    // Edges
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(88, 166, 255, ${0.15 * (1 - dist / CONNECT_DIST)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    // Nodes
    nodes.forEach(n => {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(88, 166, 255, 0.5)';
      ctx.fill();

      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  draw();
})();
</script>
