<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Models — Predict Before You Act</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:24px 32px;margin:0;min-height:100vh}

.header{text-align:center;margin-bottom:20px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#e6edf3,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.header p{color:#8b949e;font-size:13px}

.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.step-dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#30363d;cursor:pointer;border:none;padding:0;transition:all 0.2s}
.dot.active{background:#58a6ff;box-shadow:0 0 8px rgba(88,166,255,0.4)}
.nav-btn{background:none;border:1px solid #30363d;color:#8b949e;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.nav-btn:hover{border-color:#58a6ff;color:#58a6ff}
.play-btn{background:none;border:1px solid #30363d;color:#8b949e;border-radius:6px;height:32px;padding:0 12px;cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.15s}
.play-btn:hover{border-color:#58a6ff;color:#58a6ff}
.play-btn.playing{border-color:#1D9E75;color:#1D9E75}

.step-info{text-align:center;margin-bottom:16px;min-height:52px}
.step-title{font-size:16px;font-weight:600;margin-bottom:4px;color:#e6edf3}
.step-desc{font-size:13px;color:#8b949e;max-width:600px;margin:0 auto;line-height:1.5}

.canvas-wrap{display:flex;justify-content:center}
.canvas-wrap svg{max-width:100%;height:auto;opacity:0;transition:opacity 0.4s ease}
.canvas-wrap svg.visible{opacity:1}

.progress{height:2px;background:#1c2333;border-radius:1px;overflow:hidden;max-width:500px;margin:0 auto 12px}
.progress-fill{height:100%;background:#58a6ff;transition:width 0.3s ease}
</style>
</head>
<body>

<div class="header">
  <h1>World Models — Predict Before You Act</h1>
  <p>How robots imagine futures before choosing an action</p>
</div>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<div class="controls">
  <button class="nav-btn" onclick="navigate(-1)">&#8249;</button>
  <div class="step-dots" id="dots"></div>
  <button class="nav-btn" onclick="navigate(1)">&#8250;</button>
  <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Auto</button>
</div>

<div class="step-info">
  <div class="step-title" id="step-title"></div>
  <div class="step-desc" id="step-desc"></div>
</div>

<div class="canvas-wrap">
  <svg id="viz" viewBox="0 0 700 360" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
const STEPS = [
  {
    title: 'Step 1: Observe the World',
    desc: 'The robot captures the current scene through its camera — a raw observation of objects, surfaces, and spatial relationships.',
  },
  {
    title: 'Step 2: Encode to Latent State',
    desc: 'A vision encoder compresses the high-dimensional image into a compact latent vector — a learned representation capturing what matters for action.',
  },
  {
    title: 'Step 3: Imagine Multiple Futures',
    desc: 'The world model rolls out several candidate action sequences in latent space. Each branch predicts a different possible future without touching the real world.',
  },
  {
    title: 'Step 4: Score Each Future',
    desc: 'A value function evaluates each imagined trajectory. Which future gets closest to the goal? Which avoids obstacles? The model ranks all options.',
  },
  {
    title: 'Step 5: Act on the Best Plan',
    desc: 'The highest-scoring trajectory wins. The robot executes the first action, then re-observes and repeats — continuously planning ahead in its internal world.',
  },
];

let current = 0;
let autoTimer = null;
let playing = false;

const dotsEl = document.getElementById('dots');
STEPS.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => { stopPlay(); goTo(i); };
  dotsEl.appendChild(d);
});

function navigate(dir) {
  stopPlay();
  goTo(Math.max(0, Math.min(STEPS.length - 1, current + dir)));
}

function togglePlay() {
  if (playing) { stopPlay(); return; }
  playing = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  document.getElementById('play-btn').classList.add('playing');
  advanceAuto();
}

function stopPlay() {
  playing = false;
  clearTimeout(autoTimer);
  document.getElementById('play-btn').textContent = '▶ Auto';
  document.getElementById('play-btn').classList.remove('playing');
}

function advanceAuto() {
  if (!playing) return;
  const next = (current + 1) % STEPS.length;
  goTo(next);
  autoTimer = setTimeout(advanceAuto, 5000);
}

function goTo(idx) {
  current = idx;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('step-title').textContent = STEPS[idx].title;
  document.getElementById('step-desc').textContent = STEPS[idx].desc;
  document.getElementById('progress').style.width = ((idx + 1) / STEPS.length * 100) + '%';

  const svg = document.getElementById('viz');
  svg.classList.remove('visible');
  setTimeout(() => {
    renderStep(idx);
    svg.classList.add('visible');
  }, 200);
}

function renderStep(step) {
  const svg = document.getElementById('viz');

  const robot = (color = '#58a6ff') => `
    <g>
      <rect x="0" y="20" width="50" height="40" rx="6" fill="#1c2333" stroke="${color}" stroke-width="1.5"/>
      <rect x="12" y="8" width="26" height="18" rx="4" fill="#1c2333" stroke="${color}" stroke-width="1"/>
      <circle cx="20" cy="16" r="3" fill="${color}" opacity="0.8"/>
      <circle cx="30" cy="16" r="3" fill="${color}" opacity="0.8"/>
      <rect x="8" y="60" width="12" height="6" rx="2" fill="#30363d"/>
      <rect x="30" y="60" width="12" height="6" rx="2" fill="#30363d"/>
    </g>
  `;

  const scene = `
    <rect x="0" y="60" width="120" height="8" rx="2" fill="#30363d" stroke="#484f58" stroke-width="0.5"/>
    <rect x="20" y="35" width="20" height="25" rx="2" fill="#1D9E75" opacity="0.6" stroke="#1D9E75" stroke-width="0.8"/>
    <text x="30" y="52" text-anchor="middle" font-size="7" fill="#e6edf3">cup</text>
    <rect x="70" y="40" width="18" height="20" rx="1" fill="#D85A30" opacity="0.6" stroke="#D85A30" stroke-width="0.8"/>
    <text x="79" y="55" text-anchor="middle" font-size="7" fill="#e6edf3">box</text>
    <text x="60" y="85" text-anchor="middle" font-size="9" fill="#6e7681">scene</text>
  `;

  if (step === 0) {
    svg.innerHTML = `
      <g transform="translate(40,130)">${robot()}</g>
      <g transform="translate(530,100)">${scene}</g>

      <line x1="90" y1="150" x2="530" y2="120" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="90" y1="165" x2="530" y2="175" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </line>
      <line x1="90" y1="158" x2="530" y2="148" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.5">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
      </line>

      <g transform="translate(270,95)">
        <rect x="0" y="0" width="110" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
        <text x="55" y="17" text-anchor="middle" font-size="9" fill="#58a6ff">Raw Frame</text>
        <rect x="22" y="28" width="16" height="20" rx="1" fill="#1D9E75" opacity="0.4"/>
        <rect x="60" y="32" width="14" height="16" rx="1" fill="#D85A30" opacity="0.4"/>
        <rect x="12" y="52" width="86" height="4" rx="1" fill="#30363d" opacity="0.5"/>
        <rect x="2" y="25" width="106" height="1.5" fill="#58a6ff" opacity="0.3">
          <animate attributeName="y" values="25;72;25" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="325" y="210" text-anchor="middle" font-size="10" fill="#6e7681">640 x 480 x 3 = 921,600 values</text>
      <text x="325" y="228" text-anchor="middle" font-size="9" fill="#484f58">too high-dimensional to plan with directly</text>
    `;
  }

  else if (step === 1) {
    svg.innerHTML = `
      <g transform="translate(30,120)">${robot()}</g>

      <!-- Image thumbnail -->
      <g transform="translate(120,112)">
        <rect x="0" y="0" width="70" height="55" rx="4" fill="#161b22" stroke="#484f58" stroke-width="0.8"/>
        <rect x="12" y="14" width="12" height="16" rx="1" fill="#1D9E75" opacity="0.4"/>
        <rect x="40" y="18" width="10" height="12" rx="1" fill="#D85A30" opacity="0.4"/>
        <rect x="6" y="34" width="58" height="3" rx="1" fill="#30363d" opacity="0.5"/>
        <text x="35" y="10" text-anchor="middle" font-size="7" fill="#6e7681">image</text>
      </g>

      <!-- Arrow -->
      <line x1="195" y1="140" x2="250" y2="140" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="250,137 256,140 250,143" fill="#484f58"/>

      <!-- Encoder -->
      <g transform="translate(260,102)">
        <rect x="0" y="0" width="120" height="76" rx="8" fill="#161b22" stroke="#A371F7" stroke-width="1.5"/>
        <text x="60" y="22" text-anchor="middle" font-size="11" fill="#A371F7" font-weight="600">Vision Encoder</text>
        <text x="60" y="38" text-anchor="middle" font-size="9" fill="#6e7681">ViT / ResNet / DINO</text>
        <g opacity="0.5">
          <line x1="15" y1="50" x2="105" y2="50" stroke="#A371F7" stroke-width="0.5"/>
          <line x1="15" y1="56" x2="105" y2="56" stroke="#A371F7" stroke-width="0.5"/>
          <line x1="15" y1="62" x2="105" y2="62" stroke="#A371F7" stroke-width="0.5"/>
          <rect x="15" y="48" width="22" height="16" fill="#A371F7" opacity="0.15">
            <animate attributeName="x" values="15;83;15" dur="1.8s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <!-- Arrow -->
      <line x1="385" y1="140" x2="440" y2="140" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="440,137 446,140 440,143" fill="#484f58"/>

      <!-- Latent state -->
      <g transform="translate(450,105)">
        <rect x="0" y="0" width="90" height="70" rx="8" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="45" y="20" text-anchor="middle" font-size="14" fill="#1D9E75" font-weight="700">z<tspan font-size="9" dy="4">t</tspan></text>
        <g transform="translate(10,32)">
          <rect x="0" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.7"/>
          <rect x="10" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.5"/>
          <rect x="20" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.8"/>
          <rect x="30" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.3"/>
          <rect x="40" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.6"/>
          <rect x="50" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.4"/>
          <rect x="60" y="0" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.9"/>
          <rect x="0" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.4"/>
          <rect x="10" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.9"/>
          <rect x="20" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.5"/>
          <rect x="30" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.7"/>
          <rect x="40" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.2"/>
          <rect x="50" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.6"/>
          <rect x="60" y="10" width="8" height="8" rx="1" fill="#1D9E75" opacity="0.3"/>
        </g>
        <text x="45" y="64" text-anchor="middle" font-size="8" fill="#6e7681">latent state</text>
      </g>

      <text x="350" y="230" text-anchor="middle" font-size="11" fill="#D85A30">921,600 dims</text>
      <text x="350" y="250" text-anchor="middle" font-size="14" fill="#8b949e">↓</text>
      <text x="350" y="270" text-anchor="middle" font-size="11" fill="#1D9E75" font-weight="600">256 dims</text>
      <text x="350" y="295" text-anchor="middle" font-size="10" fill="#6e7681">3,600x compression — keeps only what matters for action</text>
    `;
  }

  else if (step === 2) {
    svg.innerHTML = `
      <!-- Current latent state -->
      <g transform="translate(20,130)">
        <rect x="0" y="0" width="70" height="50" rx="8" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="35" y="22" text-anchor="middle" font-size="14" fill="#1D9E75" font-weight="700">z<tspan font-size="9" dy="4">t</tspan></text>
        <text x="35" y="44" text-anchor="middle" font-size="8" fill="#6e7681">current</text>
      </g>

      <line x1="90" y1="155" x2="128" y2="155" stroke="#484f58" stroke-width="1"/>
      <polygon points="128,152 134,155 128,158" fill="#484f58"/>

      <!-- World Model -->
      <g transform="translate(138,75)">
        <rect x="0" y="0" width="110" height="160" rx="10" fill="#161b22" stroke="#A371F7" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="55" y="24" text-anchor="middle" font-size="10" fill="#A371F7" font-weight="600">World Model</text>
        <text x="55" y="42" text-anchor="middle" font-size="9" fill="#6e7681">z' = f(z, a)</text>
        <circle cx="55" cy="100" r="30" fill="none" stroke="#A371F7" stroke-width="0.5" opacity="0.3"/>
        <circle cx="55" cy="100" r="20" fill="none" stroke="#A371F7" stroke-width="0.5" opacity="0.2">
          <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="55" y="105" text-anchor="middle" font-size="20">🧠</text>
        <text x="55" y="148" text-anchor="middle" font-size="7" fill="#6e7681">internal simulation</text>
      </g>

      <!-- Branch 1: reach cup -->
      <path d="M248,110 C300,110 330,65 395,65" stroke="#1D9E75" stroke-width="2" fill="none" stroke-dasharray="5 3">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(400,48)">
        <rect x="0" y="0" width="105" height="34" rx="6" fill="#161b22" stroke="#1D9E75" stroke-width="1"/>
        <text x="52" y="14" text-anchor="middle" font-size="9" fill="#1D9E75" font-weight="500">a₁: reach cup</text>
        <text x="52" y="27" text-anchor="middle" font-size="7" fill="#6e7681">z₁ → z₂ → z₃</text>
      </g>
      <circle cx="530" cy="65" r="5" fill="#1D9E75" opacity="0.3"/>
      <circle cx="555" cy="62" r="5" fill="#1D9E75" opacity="0.5"/>
      <circle cx="580" cy="58" r="6" fill="#1D9E75" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Branch 2: reach box -->
      <path d="M248,155 C300,155 330,155 395,155" stroke="#D85A30" stroke-width="2" fill="none" stroke-dasharray="5 3">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(400,138)">
        <rect x="0" y="0" width="105" height="34" rx="6" fill="#161b22" stroke="#D85A30" stroke-width="1"/>
        <text x="52" y="14" text-anchor="middle" font-size="9" fill="#D85A30" font-weight="500">a₂: reach box</text>
        <text x="52" y="27" text-anchor="middle" font-size="7" fill="#6e7681">z₁ → z₂ → z₃</text>
      </g>
      <circle cx="530" cy="155" r="5" fill="#D85A30" opacity="0.3"/>
      <circle cx="555" cy="158" r="5" fill="#D85A30" opacity="0.4"/>
      <circle cx="580" cy="160" r="5" fill="#D85A30" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </circle>

      <!-- Branch 3: wait -->
      <path d="M248,200 C300,200 330,250 395,250" stroke="#484f58" stroke-width="2" fill="none" stroke-dasharray="5 3">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(400,233)">
        <rect x="0" y="0" width="105" height="34" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
        <text x="52" y="14" text-anchor="middle" font-size="9" fill="#8b949e" font-weight="500">a₃: wait</text>
        <text x="52" y="27" text-anchor="middle" font-size="7" fill="#6e7681">z₁ → z₂ → z₃</text>
      </g>
      <circle cx="530" cy="250" r="5" fill="#484f58" opacity="0.3"/>
      <circle cx="555" cy="252" r="5" fill="#484f58" opacity="0.3"/>
      <circle cx="580" cy="254" r="5" fill="#484f58" opacity="0.4"/>

      <text x="450" y="330" text-anchor="middle" font-size="9" fill="#6e7681">imagined trajectories — never executed in the real world</text>
    `;
  }

  else if (step === 3) {
    svg.innerHTML = `
      <!-- Branch 1: cup — HIGH score -->
      <g transform="translate(30,25)">
        <rect x="0" y="0" width="470" height="80" rx="8" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="20" y="26" font-size="11" fill="#1D9E75" font-weight="600">a₁: reach cup</text>
        <circle cx="190" cy="45" r="5" fill="#1D9E75" opacity="0.3"/>
        <circle cx="215" cy="42" r="5" fill="#1D9E75" opacity="0.5"/>
        <circle cx="240" cy="39" r="5" fill="#1D9E75" opacity="0.7"/>
        <circle cx="265" cy="36" r="6" fill="#1D9E75" opacity="0.9">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="295" y="41" font-size="9" fill="#1D9E75">✓ goal reached</text>
        <rect x="388" y="16" width="60" height="24" rx="4" fill="#1D9E75" opacity="0.2"/>
        <text x="418" y="33" text-anchor="middle" font-size="12" fill="#1D9E75" font-weight="700">0.92</text>
        <text x="20" y="65" font-size="8" fill="#6e7681">low collision risk · reaches target · stable grip predicted</text>
      </g>

      <!-- Branch 2: box — MEDIUM score -->
      <g transform="translate(30,125)">
        <rect x="0" y="0" width="470" height="80" rx="8" fill="#161b22" stroke="#D85A30" stroke-width="1"/>
        <text x="20" y="26" font-size="11" fill="#D85A30" font-weight="600">a₂: reach box</text>
        <circle cx="190" cy="45" r="5" fill="#D85A30" opacity="0.3"/>
        <circle cx="215" cy="47" r="5" fill="#D85A30" opacity="0.4"/>
        <circle cx="240" cy="44" r="5" fill="#D85A30" opacity="0.5"/>
        <circle cx="265" cy="42" r="5" fill="#D85A30" opacity="0.6"/>
        <text x="295" y="47" font-size="9" fill="#D85A30">⚠ near obstacle</text>
        <rect x="388" y="16" width="60" height="24" rx="4" fill="#D85A30" opacity="0.15"/>
        <text x="418" y="33" text-anchor="middle" font-size="12" fill="#D85A30" font-weight="700">0.61</text>
        <text x="20" y="65" font-size="8" fill="#6e7681">collision risk moderate · wrong target · partial occlusion</text>
      </g>

      <!-- Branch 3: wait — LOW score -->
      <g transform="translate(30,225)">
        <rect x="0" y="0" width="470" height="80" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
        <text x="20" y="26" font-size="11" fill="#8b949e" font-weight="600">a₃: wait</text>
        <circle cx="190" cy="45" r="5" fill="#484f58" opacity="0.3"/>
        <circle cx="215" cy="45" r="5" fill="#484f58" opacity="0.3"/>
        <circle cx="240" cy="45" r="5" fill="#484f58" opacity="0.3"/>
        <circle cx="265" cy="45" r="5" fill="#484f58" opacity="0.3"/>
        <text x="295" y="48" font-size="9" fill="#6e7681">✗ no progress</text>
        <rect x="388" y="16" width="60" height="24" rx="4" fill="#484f58" opacity="0.15"/>
        <text x="418" y="33" text-anchor="middle" font-size="12" fill="#8b949e" font-weight="700">0.12</text>
        <text x="20" y="65" font-size="8" fill="#6e7681">no collision · no progress toward goal · time wasted</text>
      </g>

      <!-- Winner badge -->
      <g transform="translate(530,40)">
        <rect x="0" y="0" width="100" height="50" rx="8" fill="#1D9E75" opacity="0.15" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" font-size="11" fill="#1D9E75" font-weight="700">★ BEST</text>
        <text x="50" y="40" text-anchor="middle" font-size="9" fill="#1D9E75">selected</text>
      </g>

      <text x="265" y="345" text-anchor="middle" font-size="10" fill="#6e7681">V(z) scores each imagined future — no real-world execution needed</text>
    `;
  }

  else if (step === 4) {
    svg.innerHTML = `
      <!-- Robot acting -->
      <g transform="translate(15,110)">
        ${robot('#1D9E75')}
        <line x1="50" y1="35" x2="82" y2="26" stroke="#1D9E75" stroke-width="2" stroke-linecap="round">
          <animate attributeName="x2" values="68;82;68" dur="2s" repeatCount="indefinite"/>
        </line>
        <circle cx="82" cy="26" r="4" fill="#1D9E75" opacity="0.6">
          <animate attributeName="cx" values="68;82;68" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(75,100)">
        <rect x="0" y="0" width="82" height="26" rx="6" fill="#1D9E75" opacity="0.15" stroke="#1D9E75" stroke-width="1"/>
        <text x="41" y="17" text-anchor="middle" font-size="9" fill="#1D9E75" font-weight="600">execute a₁</text>
      </g>

      <line x1="162" y1="140" x2="205" y2="140" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="205,137 211,140 205,143" fill="#484f58"/>

      <!-- Re-observe -->
      <g transform="translate(215,112)">
        <rect x="0" y="0" width="82" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
        <text x="41" y="17" text-anchor="middle" font-size="9" fill="#58a6ff">re-observe</text>
        <text x="41" y="40" text-anchor="middle" font-size="16">👁</text>
      </g>

      <line x1="302" y1="140" x2="345" y2="140" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="345,137 351,140 345,143" fill="#484f58"/>

      <!-- Re-encode -->
      <g transform="translate(355,115)">
        <rect x="0" y="0" width="82" height="50" rx="6" fill="#161b22" stroke="#A371F7" stroke-width="1"/>
        <text x="41" y="18" text-anchor="middle" font-size="9" fill="#A371F7">encode</text>
        <text x="41" y="40" text-anchor="middle" font-size="14" fill="#1D9E75" font-weight="700">z<tspan font-size="9" dy="4">t+1</tspan></text>
      </g>

      <line x1="442" y1="140" x2="485" y2="140" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="485,137 491,140 485,143" fill="#484f58"/>

      <!-- Re-plan -->
      <g transform="translate(495,112)">
        <rect x="0" y="0" width="92" height="56" rx="8" fill="#161b22" stroke="#A371F7" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="46" y="20" text-anchor="middle" font-size="9" fill="#A371F7">imagine</text>
        <text x="46" y="36" text-anchor="middle" font-size="9" fill="#A371F7">futures</text>
        <text x="46" y="50" text-anchor="middle" font-size="8" fill="#6e7681">again...</text>
      </g>

      <!-- Cycle arrow -->
      <path d="M545,180 C545,265 60,265 60,180" stroke="#58a6ff" stroke-width="1.5" fill="none" stroke-dasharray="8 4" opacity="0.4">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2s" repeatCount="indefinite"/>
      </path>
      <polygon points="60,183 54,175 66,175" fill="#58a6ff" opacity="0.4"/>

      <text x="305" y="300" text-anchor="middle" font-size="12" fill="#58a6ff" font-weight="600">continuous loop at every timestep</text>
      <text x="305" y="322" text-anchor="middle" font-size="10" fill="#6e7681">observe → encode → imagine → score → act → repeat</text>
      <text x="305" y="348" text-anchor="middle" font-size="10" fill="#8b949e">the robot never commits to a long plan — it re-plans from reality at every step</text>
    `;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
});

goTo(0);
setTimeout(() => { const s = document.getElementById('viz'); s.classList.add('visible'); }, 50);
setTimeout(() => { if (current === 0) togglePlay(); }, 3000);
</script>
</body>
</html>
