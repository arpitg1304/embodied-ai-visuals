<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Shaping — Sparse vs Dense</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;padding:24px;max-width:720px;margin:0 auto}
  @media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#e8e6e0}}
  .vd{width:7px;height:7px;border-radius:50%;background:#ccc;cursor:pointer;border:none;padding:0;flex-shrink:0;transition:background .2s}
  .vd.on{background:#1a1a1a}
  @media(prefers-color-scheme:dark){.vd{background:#555}.vd.on{background:#e8e6e0}}
  .vb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:0.5px solid #ccc;background:transparent;cursor:pointer;color:inherit;transition:background .15s}
  .vb:hover{background:#f0efea}
  @media(prefers-color-scheme:dark){.vb:hover{background:#2a2a2a}}
  #vtit{font-size:14px;font-weight:500}
  #vdsc{font-size:12px;color:#666;margin-top:3px;line-height:1.5}
  @media(prefers-color-scheme:dark){#vdsc{color:#aaa}}
  #vp-bar{height:2px;background:#eee;border-radius:1px;overflow:hidden;margin:12px 0 10px}
  @media(prefers-color-scheme:dark){#vp-bar{background:#333}}
  #vp{height:100%;width:0%;background:#1a1a1a}
  @media(prefers-color-scheme:dark){#vp{background:#e8e6e0}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px" id="vdots"></div>
<div style="margin-bottom:14px">
  <div id="vtit"></div>
  <div id="vdsc"></div>
</div>
<div id="va" style="min-height:220px"></div>
<div id="vp-bar"><div id="vp"></div></div>
<div style="display:flex;align-items:center;justify-content:center;gap:10px">
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(-1)">&#8592;</button>
  <button class="vb" id="vplay" style="width:44px;height:44px;font-size:16px" onclick="vtg()">&#9646;&#9646;</button>
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(1)">&#8594;</button>
</div>
<script>
const CW=56,CH=42,MX=172,MY=28;
const WALLS=new Set(['1,1','2,2','3,0','4,1']);
const GOAL=[5,1];
let manim=null;

function cX(c){return MX+c*CW+28;}
function cY(r){return MY+r*CH+21;}

const DIST={'5,1':0,'5,0':1,'5,2':1,'4,0':2,'4,2':2,'5,3':2,'3,2':3,'4,3':3,'3,3':4,'3,1':4,'2,3':5,'2,1':5,'1,3':6,'2,0':6,'0,3':7,'1,2':7,'1,0':7,'0,2':8,'0,0':8,'0,1':9};
const HCOLS=['#E86420','#F07838','#F09048','#EFAA58','#E8C270','#D5C882','#B8C8A0','#9AB8B8','#7AA0D0','#6090E0'];
function hC(d){return HCOLS[Math.min(d,9)];}

const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
const OPEN_FILL=dark?'#2a2a2a':'#ECEAE4';
const WALL_FILL=dark?'#0d0d0d':'#2E2C2A';
const OPEN_STROKE=dark?'#3a3a3a':'#C4C0B8';
const WALL_STROKE=dark?'#050505':'#1E1C1A';
const TEXT_SEC=dark?'#aaa':'#666';
const TEXT_TER=dark?'#777':'#888780';

function mBase(heat){
  let s='';
  for(let r=0;r<4;r++) for(let c=0;c<6;c++){
    const x=MX+c*CW,y=MY+r*CH,w=WALLS.has(c+','+r);
    let f=w?WALL_FILL:OPEN_FILL;
    if(!w&&heat){const d=DIST[c+','+r];if(d!==undefined)f=hC(d);}
    s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="${f}" stroke="${w?WALL_STROKE:OPEN_STROKE}" stroke-width="0.5"/>`;
  }
  return s;
}

function goalEl(){
  return `<rect x="${MX+GOAL[0]*CW+6}" y="${MY+GOAL[1]*CH+6}" width="${CW-12}" height="${CH-12}" rx="4" fill="#3B6D11"/>
<text x="${cX(GOAL[0])}" y="${cY(GOAL[1])}" text-anchor="middle" dominant-baseline="central" font-size="15" fill="white">&#9733;</text>`;
}
function agEl(c,r,id){
  return `<circle id="${id}" cx="${cX(c)}" cy="${cY(r)}" r="13" fill="#534AB7" stroke="#3C3489" stroke-width="1"/>
<text id="${id}t" x="${cX(c)}" y="${cY(r)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#CECBF6">A</text>`;
}
function stopAnim(){if(manim){clearTimeout(manim);manim=null;}}

const RWALK=[[0,2],[0,1],[0,0],[1,0],[2,0],[2,1],[3,1],[3,2],[4,2],[4,3],[3,3],[2,3],[1,3],[1,2],[0,2],[0,3],[1,3],[2,3],[3,3],[4,3],[4,2],[3,2],[3,1],[2,1],[2,0],[1,0],[0,0],[0,1],[0,2]];
const OPATH=[[0,2],[0,3],[1,3],[2,3],[3,3],[4,3],[4,2],[5,2],[5,1]];
const HPATH=[[5,2],[4,2],[5,2],[4,2],[5,2],[4,2],[5,2],[4,2],[5,2]];

const VS=[
  {t:'1 / 5 — The task',d:'An agent must navigate a maze from start to the star goal. The reward function — how we score its behavior — completely determines what it learns to do.',f:s1},
  {t:'2 / 5 — Sparse reward: only at the goal',d:'Reward = +1 when reaching the goal, 0 everywhere else. The agent gets no feedback about direction — it must stumble onto the goal by chance.',f:s2},
  {t:'3 / 5 — Dense reward: proximity gradient',d:'Reward = how close the agent is to the goal at every step. Each cell has a value — the agent can now follow the gradient directly toward the star.',f:s3},
  {t:'4 / 5 — The difference in practice',d:'Same agent, same maze, same PPO algorithm — only the reward function changes. Dense reward reaches 90%+ success in a fraction of the training time.',f:s4},
  {t:'5 / 5 — The catch: reward hacking',d:'Dense rewards introduce a new risk. The agent discovers it can hover near the goal — collecting high reward every step — without ever completing the task.',f:s5},
];
let vi=0,vplay=true,vpr=0,vtmr;
const VDUR=5400,VTK=50;

const dotsEl=document.getElementById('vdots');
VS.forEach((_,i)=>{const d=document.createElement('button');d.className='vd';d.id='vd'+i;d.onclick=()=>vg(i);dotsEl.appendChild(d);});

function vg(i){vi=i;vr();vrst();}
function vn(d){vi=(vi+d+VS.length)%VS.length;vr();vrst();}
function vr(){
  stopAnim();
  VS.forEach((_,i)=>document.getElementById('vd'+i).className='vd'+(i===vi?' on':''));
  document.getElementById('vtit').textContent=VS[vi].t;
  document.getElementById('vdsc').textContent=VS[vi].d;
  const a=document.getElementById('va');a.style.animation='none';void a.offsetWidth;a.style.animation='fadeUp .3s ease';
  a.innerHTML='';VS[vi].f(a);
}
function vrst(){clearInterval(vtmr);vpr=0;document.getElementById('vp').style.width='0%';if(vplay)vstrt();}
function vstrt(){vtmr=setInterval(()=>{vpr+=100*VTK/VDUR;document.getElementById('vp').style.width=Math.min(vpr,100)+'%';if(vpr>=100){clearInterval(vtmr);vi=(vi+1)%VS.length;vr();vpr=0;document.getElementById('vp').style.width='0%';vstrt();}},VTK);}
function vtg(){vplay=!vplay;document.getElementById('vplay').innerHTML=vplay?'&#9646;&#9646;':'&#9654;';if(vplay)vstrt();else clearInterval(vtmr);}

function s1(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 218">
${mBase(false)}${goalEl()}${agEl(0,2,'a1')}
<text x="${cX(0,2)}" y="${MY+4*CH+14}" text-anchor="middle" font-size="11" fill="#534AB7">start</text>
<text x="${cX(5,1)}" y="${MY-10}" text-anchor="middle" font-size="11" fill="#3B6D11">goal</text>
<text x="340" y="210" text-anchor="middle" font-size="11" fill="${TEXT_SEC}">The reward function is the only signal the agent has. Design it poorly — get the wrong behavior.</text>
</svg>`;}

function s2(el){
  let zeros='';
  [[0,0],[2,0],[0,1],[3,2],[1,3],[3,3],[4,3]].forEach(([c,r])=>{
    zeros+=`<text x="${cX(c)}" y="${cY(r)}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="${TEXT_TER}">0</text>`;
  });
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 218">
${mBase(false)}${zeros}${goalEl()}${agEl(0,2,'a2')}
<text x="518" y="88" font-size="10" fill="#3B6D11">&#8592; +1</text>
<text id="scnt" x="586" y="22" text-anchor="middle" font-size="11" fill="${TEXT_TER}">step 0</text>
<text x="340" y="210" text-anchor="middle" font-size="11" fill="${TEXT_SEC}">Reward = 0 on every step. No gradient to follow. The agent wanders blind.</text>
</svg>`;
  let si=0;
  const step=()=>{
    si++;const[c,r]=RWALK[si%RWALK.length];
    const ci=el.querySelector('#a2'),tx=el.querySelector('#a2t'),cnt=el.querySelector('#scnt');
    if(ci){ci.setAttribute('cx',cX(c));ci.setAttribute('cy',cY(r));}
    if(tx){tx.setAttribute('x',cX(c));tx.setAttribute('y',cY(r));}
    if(cnt)cnt.textContent='step '+si;
    manim=setTimeout(step,340);
  };
  stopAnim();manim=setTimeout(step,400);
}

function s3(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 218">
${mBase(true)}
<rect x="28" y="34" width="12" height="12" rx="2" fill="${hC(0)}"/>
<text x="44" y="40" dominant-baseline="central" font-size="10" fill="${TEXT_SEC}">high reward</text>
<rect x="28" y="52" width="12" height="12" rx="2" fill="${hC(9)}"/>
<text x="44" y="58" dominant-baseline="central" font-size="10" fill="${TEXT_SEC}">low reward</text>
${goalEl()}${agEl(0,2,'a3')}
<text x="340" y="210" text-anchor="middle" font-size="11" fill="${TEXT_SEC}">Every cell now has a value. The agent follows the gradient — no luck required.</text>
</svg>`;
  let i=0;
  const step=()=>{
    const[c,r]=OPATH[i%OPATH.length];
    const ci=el.querySelector('#a3'),tx=el.querySelector('#a3t');
    if(ci){ci.setAttribute('cx',cX(c));ci.setAttribute('cy',cY(r));}
    if(tx){tx.setAttribute('x',cX(c));tx.setAttribute('y',cY(r));}
    const atGoal=(i%OPATH.length===OPATH.length-1);i++;
    manim=setTimeout(step,atGoal?1100:470);
  };
  stopAnim();manim=setTimeout(step,400);
}

function s4(el){
  const sp=[0,0.3,0.7,1.2,1.8,2.6,3.4,4.0,4.6,5.2];
  const dn=[0,18,52,74,82,87,90,91,92,93];
  const BH=118,BW=240,GY=162,PAD=4;
  const bw=(BW-PAD*(sp.length+1))/sp.length;
  let sc='',dc='';
  sp.forEach((v,i)=>{const h=v/100*BH;sc+=`<rect x="${80+PAD+i*(bw+PAD)}" y="${GY-h}" width="${bw}" height="${h}" fill="#E24B4A" opacity="0.75"/>`;});
  dn.forEach((v,i)=>{const h=v/100*BH;dc+=`<rect x="${360+PAD+i*(bw+PAD)}" y="${GY-h}" width="${bw}" height="${h}" fill="#639922" opacity="0.82"/>`;});
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 218">
<text x="200" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#A32D2D">Sparse reward</text>
<rect x="80" y="${GY-BH}" width="${BW}" height="${BH}" fill="none" stroke="#C4C0B8" stroke-width="0.5"/>
${sc}
<line x1="80" y1="${GY}" x2="${80+BW}" y2="${GY}" stroke="#C4C0B8" stroke-width="0.5"/>
<text x="80" y="${GY+13}" font-size="9" fill="${TEXT_TER}">0</text>
<text x="${80+BW}" y="${GY+13}" text-anchor="end" font-size="9" fill="${TEXT_TER}">50k episodes</text>
<text x="78" y="${GY}" text-anchor="end" font-size="9" fill="${TEXT_TER}">0%</text>
<text x="78" y="${GY-BH+4}" text-anchor="end" font-size="9" fill="${TEXT_TER}">100%</text>
<text x="200" y="${GY+30}" text-anchor="middle" font-size="12" font-weight="500" fill="#A32D2D">~5% success rate</text>
<text x="480" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">Dense reward</text>
<rect x="360" y="${GY-BH}" width="${BW}" height="${BH}" fill="none" stroke="#C4C0B8" stroke-width="0.5"/>
${dc}
<line x1="360" y1="${GY}" x2="${360+BW}" y2="${GY}" stroke="#C4C0B8" stroke-width="0.5"/>
<text x="360" y="${GY+13}" font-size="9" fill="${TEXT_TER}">0</text>
<text x="${360+BW}" y="${GY+13}" text-anchor="end" font-size="9" fill="${TEXT_TER}">10k episodes</text>
<text x="358" y="${GY}" text-anchor="end" font-size="9" fill="${TEXT_TER}">0%</text>
<text x="358" y="${GY-BH+4}" text-anchor="end" font-size="9" fill="${TEXT_TER}">100%</text>
<text x="480" y="${GY+30}" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">~93% success rate</text>
<text x="340" y="210" text-anchor="middle" font-size="11" fill="${TEXT_SEC}">Same agent. Same maze. Same algorithm. Only the reward definition changed.</text>
</svg>`;}

function s5(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 218">
${mBase(true)}${goalEl()}
<rect x="${MX+4*CW+2}" y="${MY+2*CH+2}" width="${CW-4}" height="${CH-4}" rx="3" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>
${agEl(5,2,'a5')}
<rect x="414" y="8" width="242" height="44" rx="6" fill="#FCEBEB" stroke="#F7C1C1" stroke-width="0.5"/>
<text x="535" y="24" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#A32D2D">task completion: 0%</text>
<text x="535" y="42" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#791F1F">reward per step: high — goal never reached</text>
<text x="340" y="210" text-anchor="middle" font-size="11" fill="${TEXT_SEC}">Reward hacking: maximizes the metric, ignores the intent. The alignment problem in miniature.</text>
</svg>`;
  let i=0;
  const step=()=>{
    const[c,r]=HPATH[i%HPATH.length];
    const ci=el.querySelector('#a5'),tx=el.querySelector('#a5t');
    if(ci){ci.setAttribute('cx',cX(c));ci.setAttribute('cy',cY(r));}
    if(tx){tx.setAttribute('x',cX(c));tx.setAttribute('y',cY(r));}
    i++;manim=setTimeout(step,580);
  };
  stopAnim();manim=setTimeout(step,300);
}

vr();vstrt();
</script>
</body>
</html>
