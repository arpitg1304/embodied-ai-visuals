
<style>
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.12}60%{opacity:.92}}
@keyframes march{to{stroke-dashoffset:-14}}
.vd{width:7px;height:7px;border-radius:50%;background:var(--color-border-secondary);cursor:pointer;border:none;padding:0;flex-shrink:0;transition:background .2s}
.vd.on{background:var(--color-text-primary)}
.vb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;color:var(--color-text-primary);transition:background .15s}
.vb:hover{background:var(--color-background-secondary)}
</style>
<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px" id="vdots"></div>
<div style="margin-bottom:14px">
  <div id="vtit" style="font-size:14px;font-weight:500;color:var(--color-text-primary)"></div>
  <div id="vdsc" style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;line-height:1.5"></div>
</div>
<div id="va" style="min-height:220px"></div>
<div style="height:2px;background:var(--color-border-tertiary);border-radius:1px;overflow:hidden;margin:12px 0 10px">
  <div id="vp" style="height:100%;width:0%;background:var(--color-text-primary)"></div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:10px">
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(-1)">&#8592;</button>
  <button class="vb" id="vplay" style="width:44px;height:44px;font-size:16px" onclick="vtg()">&#9646;&#9646;</button>
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(1)">&#8594;</button>
</div>
<script>
const VS=[
  {t:'1 / 5 — Observation',d:'The robot perceives two things simultaneously: an RGB camera frame of the scene, and a natural language instruction from a human operator.',f:s1},
  {t:'2 / 5 — Tokenization',d:'The image is cut into patches; the text is split into word tokens. A vision encoder and a language tokenizer project both into the same 512-dimensional space.',f:s2},
  {t:'3 / 5 — Unified sequence',d:'Image patch tokens and text tokens are concatenated into a single sequence. The transformer sees them all together — this is the core VLA insight.',f:s3},
  {t:'4 / 5 — Transformer layers',d:'Tokens attend to each other across 32 layers. Cross-modal attention lets the word "red" learn to attend strongly to the visually-red image patches.',f:s4},
  {t:'5 / 5 — Action output',d:'The final layer predicts a 7-DoF action: end-effector translation (Δx, Δy, Δz), rotation, and gripper state — sent directly to the robot controller.',f:s5},
];
let vi=0,vplay=true,vpr=0,vt;
const VDUR=4800,VTK=50;
const dotsEl=document.getElementById('vdots');
VS.forEach((_,i)=>{
  const d=document.createElement('button');
  d.className='vd';d.id='vd'+i;d.onclick=()=>vg(i);dotsEl.appendChild(d);
});
function vg(i){vi=i;vr();vrst();}
function vn(d){vi=(vi+d+VS.length)%VS.length;vr();vrst();}
function vr(){
  VS.forEach((_,i)=>document.getElementById('vd'+i).className='vd'+(i===vi?' on':''));
  document.getElementById('vtit').textContent=VS[vi].t;
  document.getElementById('vdsc').textContent=VS[vi].d;
  const a=document.getElementById('va');
  a.style.animation='none';void a.offsetWidth;
  a.style.animation='fadeUp .3s ease';
  a.innerHTML='';VS[vi].f(a);
}
function vrst(){
  clearInterval(vt);vpr=0;
  document.getElementById('vp').style.width='0%';
  if(vplay)vstrt();
}
function vstrt(){
  vt=setInterval(()=>{
    vpr+=100*VTK/VDUR;
    document.getElementById('vp').style.width=Math.min(vpr,100)+'%';
    if(vpr>=100){clearInterval(vt);vi=(vi+1)%VS.length;vr();vpr=0;document.getElementById('vp').style.width='0%';vstrt();}
  },VTK);
}
function vtg(){
  vplay=!vplay;
  document.getElementById('vplay').innerHTML=vplay?'&#9646;&#9646;':'&#9654;';
  if(vplay)vstrt();else clearInterval(vt);
}
const AR=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;

function s1(el){
  const pc=['#D4E8C2','#C8E0B8','#A8D4B0','#88C4B0','#78B8B0','#90C8C0','#C0D8B8','#B8D0B0','#D8C090','#E8A060','#F08040','#E87040','#B8C8A8','#C8C8A0','#E8B070','#F07040','#E86030','#D05020','#A0B898','#B8B890','#D0A070','#E08050','#D05030','#B83020','#88A880','#98A880','#B09060','#C07040','#B04020','#903020'];
  const patches=pc.map((c,i)=>{const col=i%6,row=Math.floor(i/6);return `<rect x="${50+col*35}" y="${34+row*30}" width="34" height="29" fill="${c}"/>`;}).join('');
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 244">${AR}
<rect x="38" y="22" width="228" height="166" rx="6" fill="#1e1e1e"/>
${patches}
<text x="152" y="210" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">RGB camera frame</text>
<text x="314" y="116" text-anchor="middle" font-size="20" font-weight="300" fill="var(--color-text-tertiary)">+</text>
<rect x="346" y="54" width="294" height="90" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text x="364" y="84" font-size="11" fill="var(--color-text-tertiary)">Instruction</text>
<text x="364" y="112" font-size="15" font-weight="500" fill="var(--color-text-primary)">"Pick up the red cup"</text>
<rect x="622" y="98" width="2" height="16" fill="var(--color-text-primary)" style="animation:blink 1s ease infinite"/>
<text x="493" y="168" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Natural language command</text>
</svg>`;
}

function s2(el){
  const pc=['#D4E8C2','#C8E0B8','#A8D4B0','#D8C090','#E8A060','#F08040','#B8C8A8','#E8B070','#B09060','#88A880','#C8E0B8','#78B8B0'];
  const patches=pc.map((c,i)=>{const col=i%4,row=Math.floor(i/4);return `<rect x="${22+col*40}" y="${42+row*40}" width="36" height="36" rx="3" fill="${c}"/><text x="${22+col*40+18}" y="${42+row*40+18}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="rgba(0,0,0,0.3)">${i+1}</text>`;}).join('');
  const bh=[72,38,56,24,62,78],bf=[0.78,0.36,0.58,0.26,0.66,0.88];
  const bars=bh.map((h,i)=>`<rect x="${194+i*11}" y="${90+72-h}" width="9" height="${h}" rx="2" fill="#1D9E75" opacity="${bf[i]}"/>`).join('');
  const words=['Pick','up','the','red','cup'],wc=['#534AB7','#534AB7','#534AB7','#993C1D','#534AB7'],wb=['#EEEDFE','#EEEDFE','#EEEDFE','#FAECE7','#EEEDFE'];
  const wtoks=words.map((w,i)=>{const x=390+i*54;return `<rect x="${x}" y="54" width="48" height="32" rx="6" fill="${wb[i]}" stroke="${wc[i]}" stroke-width="0.5"/><text x="${x+24}" y="70" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="${wc[i]}">${w}</text><text x="${x+24}" y="102" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)">#${8100+i*143}</text>`;}).join('');
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 262">${AR}
<text x="108" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#0F6E56">Vision encoder</text>
<text x="516" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#534AB7">Language tokenizer</text>
${patches}
<text x="108" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">12 image patches</text>
<line x1="174" y1="122" x2="190" y2="122" stroke="var(--color-text-tertiary)" stroke-width="1" marker-end="url(#ar)"/>
${bars}
<text x="227" y="200" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">512-d vector each</text>
<line x1="370" y1="30" x2="370" y2="238" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 4"/>
${wtoks}
<line x1="516" y1="94" x2="516" y2="124" stroke="var(--color-text-tertiary)" stroke-width="1" marker-end="url(#ar)"/>
<text x="516" y="148" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">5 text embeddings</text>
<text x="516" y="164" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">512-d each</text>
<text x="340" y="244" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">both projected into the same 512-dimensional embedding space</text>
</svg>`;
}

function s3(el){
  const pf=['#D4E8C2','#C8E0B8','#A8D4B0','#D8C090','#E8A060','#F08040','#B8C8A8','#E8B070','#B09060','#88A880'];
  const TW=36,TH=46,TG=3,TX=12,TY=76;
  const ptoks=pf.map((c,i)=>`<rect x="${TX+i*(TW+TG)}" y="${TY}" width="${TW}" height="${TH}" rx="4" fill="${c}"/><rect x="${TX+i*(TW+TG)+TW/2-7}" y="${TY+5}" width="14" height="10" rx="1" fill="rgba(0,0,0,0.13)"/><text x="${TX+i*(TW+TG)+TW/2}" y="${TY+TH-10}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#085041">P${i+1}</text>`).join('');
  const words=['Pick','up','the','red','cup'],wc=['#534AB7','#534AB7','#534AB7','#993C1D','#534AB7'],wb=['#EEEDFE','#EEEDFE','#EEEDFE','#FAECE7','#EEEDFE'];
  const wtoks=words.map((w,i)=>{const x=TX+(11+i)*(TW+TG);return `<rect x="${x}" y="${TY}" width="${TW}" height="${TH}" rx="4" fill="${wb[i]}" stroke="${wc[i]}" stroke-width="0.5"/><text x="${x+TW/2}" y="${TY+TH/2}" text-anchor="middle" dominant-baseline="central" font-size="${w.length>3?9:11}" font-weight="500" fill="${wc[i]}">${w}</text>`;}).join('');
  const ax=TX+16*(TW+TG);
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 200">
<text x="340" y="42" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">35 tokens — image + language — as one unified sequence</text>
<text x="340" y="60" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">same 512-d embedding space throughout</text>
${ptoks}
<text x="${TX+10*(TW+TG)+TW/2}" y="${TY+TH/2}" text-anchor="middle" dominant-baseline="central" font-size="16" fill="var(--color-text-tertiary)">&#8943;</text>
${wtoks}
<rect x="${ax}" y="${TY}" width="${TW}" height="${TH}" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="${ax+TW/2}" y="${TY+17}" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="500" fill="#712B13">ACT</text>
<text x="${ax+TW/2}" y="${TY+34}" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#993C1D">?</text>
<rect x="12" y="148" width="11" height="11" rx="2" fill="#A8D4B0"/>
<text x="28" y="154" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">Image patch tokens</text>
<rect x="190" y="148" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="206" y="154" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">Language tokens</text>
<rect x="348" y="148" width="11" height="11" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="364" y="154" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">Action token (predicted)</text>
</svg>`;
}

function s4(el){
  const layers=[{y:28,l:'Layers 1–10 — syntax and local context'},{y:104,l:'Layers 11–22 — semantic relationships'},{y:180,l:'Layers 23–32 — action-relevant representations'}];
  const lsvg=layers.map(({y,l})=>`<rect x="60" y="${y}" width="560" height="40" rx="7" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><text x="78" y="${y+20}" dominant-baseline="central" font-size="11" fill="var(--color-text-tertiary)">${l}</text>`).join('');
  const MW=22,MH=16,MG=4,MSX=60,MSY=256;
  let mt='';
  for(let i=0;i<17;i++){
    const x=MSX+i*(MW+MG);
    const isOP=i===3||i===4,isTok=i>=12&&i<=16,isRT=i===15;
    const fill=isOP?'#F08040':isTok?(isRT?'#D85A30':'#AFA9EC'):'#9FE1CB';
    mt+=`<rect x="${x}" y="${MSY}" width="${MW}" height="${MH}" rx="3" fill="${fill}" opacity="${isOP||isRT?1:.4}"/>`;
  }
  const rTX=MSX+15*(MW+MG)+MW/2;
  const p3X=MSX+3*(MW+MG)+MW/2;
  const p4X=MSX+4*(MW+MG)+MW/2;
  const arcY=MSY-24;
  const mid1=Math.round((rTX+p3X)/2);
  const mid2=Math.round((rTX+p4X)/2);
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 316">${AR}
<line x1="340" y1="8" x2="340" y2="25" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="16" font-size="10" font-weight="500" fill="#993C1D">action head</text>
${lsvg}
<line x1="340" y1="252" x2="340" y2="224" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar)"/>
${mt}
<path d="M${rTX} ${MSY} Q${mid1} ${arcY} ${p3X} ${MSY}" fill="none" stroke="#E86030" stroke-width="2.5" style="animation:pulse 2s ease-in-out infinite"/>
<path d="M${rTX} ${MSY} Q${mid2} ${arcY+5} ${p4X} ${MSY}" fill="none" stroke="#E86030" stroke-width="1.5" style="animation:pulse 2s ease-in-out infinite .5s"/>
<text x="${Math.round((p3X+p4X)/2)}" y="${MSY+MH+14}" text-anchor="middle" font-size="10" fill="#993C1D">red patches</text>
<text x="${rTX}" y="${MSY+MH+14}" text-anchor="middle" font-size="10" fill="#993C1D">"red"</text>
<text x="340" y="306" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">cross-modal attention: the word "red" attends to visually-red image patches</text>
</svg>`;
}

function s5(el){
  const acts=[{l:'Δ x',v:'+0.12 m',f:.70,s:1,c:'#1D9E75'},{l:'Δ y',v:'−0.04 m',f:.25,s:-1,c:'#1D9E75'},{l:'Δ z',v:'+0.08 m',f:.48,s:1,c:'#1D9E75'},{l:'Δ roll',v:'+0.02 rad',f:.12,s:1,c:'#7F77DD'},{l:'Δ pitch',v:'−0.08 rad',f:.48,s:-1,c:'#7F77DD'},{l:'Δ yaw',v:'+0.01 rad',f:.06,s:1,c:'#7F77DD'},{l:'gripper',v:'0.85 (open)',f:.85,s:1,c:'#D85A30'}];
  const BX=62,BH=128,BY=28,BRH=22,BG=9;
  const bars=acts.map(({l,v,f,s,c},i)=>{
    const y=BY+i*(BRH+BG);
    const bw=Math.round(f*BH);
    const bxs=s===1?BX+BH:BX+BH-bw;
    return `<text x="${BX-6}" y="${y+BRH/2}" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="500" fill="${c}">${l}</text><rect x="${BX}" y="${y}" width="${BH*2}" height="${BRH}" rx="3" fill="var(--color-background-secondary)"/><line x1="${BX+BH}" y1="${y}" x2="${BX+BH}" y2="${y+BRH}" stroke="var(--color-border-secondary)" stroke-width="0.5"/><rect x="${bxs}" y="${y}" width="${bw}" height="${BRH}" rx="3" fill="${c}" opacity="0.82"/><text x="${BX+BH*2+8}" y="${y+BRH/2}" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">${v}</text>`;
  }).join('');
  const AX=556,AY=126;
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 272">${AR}
<text x="${BX+BH}" y="16" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-secondary)">Predicted 7-DoF action</text>
${bars}
<rect x="${BX}" y="232" width="11" height="11" rx="2" fill="#1D9E75" opacity="0.82"/>
<text x="${BX+16}" y="237" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">translation</text>
<rect x="${BX+96}" y="232" width="11" height="11" rx="2" fill="#7F77DD" opacity="0.82"/>
<text x="${BX+112}" y="237" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">rotation</text>
<rect x="${BX+176}" y="232" width="11" height="11" rx="2" fill="#D85A30" opacity="0.82"/>
<text x="${BX+192}" y="237" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)">gripper</text>
<rect x="${AX-22}" y="${AY+78}" width="44" height="10" rx="3" fill="var(--color-border-secondary)"/>
<line x1="${AX}" y1="${AY+78}" x2="${AX-20}" y2="${AY+18}" stroke="var(--color-text-secondary)" stroke-width="7" stroke-linecap="round"/>
<circle cx="${AX-20}" cy="${AY+18}" r="6" fill="#1D9E75"/>
<line x1="${AX-20}" y1="${AY+18}" x2="${AX+26}" y2="${AY-28}" stroke="var(--color-text-secondary)" stroke-width="5" stroke-linecap="round"/>
<circle cx="${AX+26}" cy="${AY-28}" r="5" fill="#1D9E75"/>
<line x1="${AX+26}" y1="${AY-28}" x2="${AX+12}" y2="${AY-52}" stroke="#D85A30" stroke-width="4" stroke-linecap="round"/>
<line x1="${AX+26}" y1="${AY-28}" x2="${AX+40}" y2="${AY-52}" stroke="#D85A30" stroke-width="4" stroke-linecap="round"/>
<rect x="${AX+14}" y="${AY-88}" width="18" height="24" rx="3" fill="#F08040" opacity="0.85"/>
<rect x="${AX+11}" y="${AY-90}" width="24" height="5" rx="1" fill="#C07040" opacity="0.85"/>
<path d="M${AX+26} ${AY-53} Q${AX+28} ${AY-68} ${AX+24} ${AY-82}" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="3 3" style="animation:march 1s linear infinite"/>
<text x="${AX}" y="${AY+108}" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">sent to robot controller</text>
</svg>`;
}
vr();vstrt();
</script>
