<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sim-to-Real Gap Explainer</title>
<style>
  :root {
    --color-bg: #0d1117;
    --color-surface: #161b22;
    --color-surface-hover: #1c2333;
    --color-border: #30363d;
    --color-text-primary: #e6edf3;
    --color-text-secondary: #8b949e;
    --color-text-tertiary: #6e7681;
    --color-accent: #58a6ff;
    --color-accent-subtle: rgba(88, 166, 255, 0.1);
    --color-border-secondary: #30363d;
    --color-border-tertiary: #21262d;
    --color-background-secondary: #1c2333;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text-primary);
    padding: 24px 32px;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes dash{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
  @keyframes flicker{0%,100%{opacity:.65}50%{opacity:.2}}
  .vd{width:7px;height:7px;border-radius:50%;background:var(--color-border-secondary);cursor:pointer;border:none;padding:0;flex-shrink:0;transition:background .2s}
  .vd.on{background:var(--color-text-primary)}
  .vb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;color:var(--color-text-primary);transition:background .15s}
  .vb:hover{background:var(--color-background-secondary)}
  .ndot{animation:flicker 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px" id="vdots"></div>
<div style="margin-bottom:14px">
  <div id="vtit" style="font-size:14px;font-weight:500;color:var(--color-text-primary)"></div>
  <div id="vdsc" style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;line-height:1.5"></div>
</div>
<div id="va" style="min-height:230px"></div>
<div style="height:2px;background:var(--color-border-tertiary);border-radius:1px;overflow:hidden;margin:12px 0 10px">
  <div id="vp" style="height:100%;width:0%;background:var(--color-text-primary)"></div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:10px">
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(-1)">&#8592;</button>
  <button class="vb" id="vplay" style="width:44px;height:44px;font-size:16px" onclick="vtg()">&#9646;&#9646;</button>
  <button class="vb" style="width:36px;height:36px;font-size:14px" onclick="vn(1)">&#8594;</button>
</div>
<script>
const VS=[
  {t:'1 / 5 — Training in simulation',d:'A policy trains entirely in simulation — millions of episodes, no hardware wear. Perfect physics, clean sensors, unlimited resets. Success rate approaches 99%.',f:s1},
  {t:'2 / 5 — The visual domain gap',d:'Deployed in the real world, the robot faces different textures, lighting, and material properties. Its perception — trained on synthetic imagery — mismatches reality.',f:s2},
  {t:'3 / 5 — The physics fidelity gap',d:'Simulated physics are idealized. Real contact involves friction, micro-flex, and surface irregularity the simulator never modeled. Grasps fail in unexpected ways.',f:s3},
  {t:'4 / 5 — Sensor noise and latency',d:'Real depth sensors add 8–15 mm of noise per point that is absent in simulation. Small errors in the world model compound into task-level failures.',f:s4},
  {t:'5 / 5 — Bridging the gap: domain randomization',d:'Train across thousands of randomized sim variants — textures, lighting, friction, camera pose, sensor noise. The policy learns invariances that survive real-world deployment.',f:s5},
];
let vi=0,vplay=true,vpr=0,vt;
const VDUR=5200,VTK=50;
const dotsEl=document.getElementById('vdots');
VS.forEach((_,i)=>{const d=document.createElement('button');d.className='vd';d.id='vd'+i;d.onclick=()=>vg(i);dotsEl.appendChild(d);});
function vg(i){vi=i;vr();vrst();}
function vn(d){vi=(vi+d+VS.length)%VS.length;vr();vrst();}
function vr(){
  VS.forEach((_,i)=>document.getElementById('vd'+i).className='vd'+(i===vi?' on':''));
  document.getElementById('vtit').textContent=VS[vi].t;
  document.getElementById('vdsc').textContent=VS[vi].d;
  const a=document.getElementById('va');a.style.animation='none';void a.offsetWidth;a.style.animation='fadeUp .3s ease';
  a.innerHTML='';VS[vi].f(a);
}
function vrst(){clearInterval(vt);vpr=0;document.getElementById('vp').style.width='0%';if(vplay)vstrt();}
function vstrt(){vt=setInterval(()=>{vpr+=100*VTK/VDUR;document.getElementById('vp').style.width=Math.min(vpr,100)+'%';if(vpr>=100){clearInterval(vt);vi=(vi+1)%VS.length;vr();vpr=0;document.getElementById('vp').style.width='0%';vstrt();}},VTK);}
function vtg(){vplay=!vplay;document.getElementById('vplay').innerHTML=vplay?'&#9646;&#9646;':'&#9654;';if(vplay)vstrt();else clearInterval(vt);}
const AR=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;

function s1(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 232">${AR}
<rect x="60" y="16" width="560" height="178" rx="8" fill="#E8F4FD" stroke="#B5D4F4" stroke-width="0.5"/>
<rect x="72" y="24" width="28" height="16" rx="3" fill="#B5D4F4"/>
<text x="86" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#0C447C">SIM</text>
<line x1="80" y1="172" x2="600" y2="172" stroke="#B4B2A9" stroke-width="1"/>
<rect x="210" y="152" width="250" height="18" rx="2" fill="#B4B2A9"/>
<rect x="234" y="170" width="10" height="22" fill="#888780"/>
<rect x="432" y="170" width="10" height="22" fill="#888780"/>
<rect x="305" y="110" width="54" height="42" rx="3" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
<rect x="148" y="158" width="22" height="14" rx="2" fill="#5F5E5A"/>
<line x1="159" y1="162" x2="218" y2="98" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<line x1="218" y1="98" x2="298" y2="114" stroke="#888780" stroke-width="5" stroke-linecap="round"/>
<line x1="298" y1="114" x2="289" y2="105" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round"/>
<line x1="298" y1="114" x2="307" y2="105" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round"/>
<path d="M159 162 Q218 46 300 110" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7" style="animation:dash 1.4s linear infinite"/>
<rect x="456" y="28" width="146" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="529" y="41" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#27500A">98.4% success rate</text>
<text x="340" y="216" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Simulated environment: perfect physics, clean visuals, unlimited resets</text>
</svg>`;
}

function s2(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 232">
<rect x="48" y="16" width="272" height="176" rx="8" fill="#E8F4FD" stroke="#B5D4F4" stroke-width="0.5"/>
<rect x="58" y="24" width="28" height="16" rx="3" fill="#B5D4F4"/>
<text x="72" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#0C447C">SIM</text>
<rect x="360" y="16" width="272" height="176" rx="8" fill="#FDF4E8" stroke="#EF9F27" stroke-width="0.5"/>
<rect x="370" y="24" width="30" height="16" rx="3" fill="#FAC775"/>
<text x="385" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#633806">REAL</text>
<text x="340" y="108" text-anchor="middle" font-size="22" fill="var(--color-border-secondary)">&#8800;</text>
<rect x="118" y="142" width="144" height="8" rx="1" fill="#D3D1C7"/>
<rect x="152" y="98" width="58" height="44" rx="3" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
<circle cx="294" cy="36" r="10" fill="#EF9F27" opacity="0.5"/>
<text x="184" y="168" text-anchor="middle" font-size="10" fill="#185FA5">flat color · uniform light</text>
<rect x="430" y="142" width="144" height="8" rx="1" fill="#B4A898"/>
<ellipse cx="502" cy="144" rx="30" ry="5" fill="rgba(0,0,0,0.1)"/>
<rect x="472" y="98" width="58" height="44" rx="3" fill="#8B6E4E" stroke="#633806" stroke-width="0.5"/>
<circle cx="479" cy="106" r="2" fill="rgba(0,0,0,0.2)"/>
<circle cx="493" cy="101" r="1.5" fill="rgba(0,0,0,0.15)"/>
<circle cx="509" cy="110" r="2" fill="rgba(0,0,0,0.18)"/>
<circle cx="520" cy="103" r="1.5" fill="rgba(0,0,0,0.12)"/>
<circle cx="485" cy="124" r="1.5" fill="rgba(0,0,0,0.14)"/>
<circle cx="502" cy="129" r="2" fill="rgba(0,0,0,0.16)"/>
<circle cx="517" cy="120" r="1.5" fill="rgba(0,0,0,0.12)"/>
<circle cx="376" cy="40" r="6" fill="#EF9F27" opacity="0.35"/>
<circle cx="610" cy="32" r="7" fill="#EF9F27" opacity="0.28"/>
<text x="496" y="168" text-anchor="middle" font-size="10" fill="#993C1D">texture · shadows · real light</text>
<text x="340" y="212" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Policy trained on blue synthetic cubes — encounters brown, textured, shadowed objects.</text>
</svg>`;
}

function s3(el){
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 232">
<rect x="48" y="16" width="272" height="176" rx="8" fill="#E8F4FD" stroke="#B5D4F4" stroke-width="0.5"/>
<rect x="58" y="24" width="28" height="16" rx="3" fill="#B5D4F4"/>
<text x="72" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#0C447C">SIM</text>
<rect x="360" y="16" width="272" height="176" rx="8" fill="#FDF4E8" stroke="#EF9F27" stroke-width="0.5"/>
<rect x="370" y="24" width="30" height="16" rx="3" fill="#FAC775"/>
<text x="385" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#633806">REAL</text>
<text x="340" y="108" text-anchor="middle" font-size="22" fill="var(--color-border-secondary)">&#8800;</text>
<rect x="88" y="152" width="200" height="8" rx="1" fill="#D3D1C7"/>
<rect x="148" y="108" width="58" height="44" rx="2" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
<line x1="177" y1="72" x2="167" y2="106" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<line x1="177" y1="72" x2="187" y2="106" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<line x1="165" y1="108" x2="191" y2="108" stroke="#3B6D11" stroke-width="2.5" stroke-linecap="round"/>
<text x="184" y="174" text-anchor="middle" font-size="10" fill="#27500A">centered contact — stable</text>
<rect x="400" y="152" width="200" height="8" rx="1" fill="#B4A898"/>
<line x1="490" y1="72" x2="474" y2="106" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<line x1="490" y1="72" x2="484" y2="106" stroke="#888780" stroke-width="4" stroke-linecap="round"/>
<g transform="rotate(17, 492, 152)">
  <rect x="462" y="108" width="58" height="44" rx="2" fill="#8B6E4E" stroke="#993C1D" stroke-width="0.5"/>
</g>
<line x1="464" y1="109" x2="474" y2="109" stroke="#A32D2D" stroke-width="2.5" stroke-linecap="round"/>
<text x="496" y="174" text-anchor="middle" font-size="10" fill="#993C1D">off-center — cube tips</text>
<text x="340" y="212" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Idealized sim physics never model real friction, micro-flex, or surface irregularity.</text>
</svg>`;
}

function s4(el){
  const cPts=[];
  for(let r=0;r<4;r++)for(let c=0;c<5;c++)cPts.push([116+c*26,86+r*22]);
  const nPts=[[440,82],[461,76],[450,94],[483,80],[473,97],[504,85],[437,107],[459,101],[478,112],[451,122],[495,104],[516,92],[438,128],[465,119],[485,126],[508,116],[523,108],[457,136],[478,130],[495,139],[516,130],[445,77],[522,76],[503,140],[442,148]];
  const opac=[.7,.5,.8,.4,.65,.7,.5,.75,.6,.4,.7,.5,.6,.8,.5,.7,.4,.65,.8,.5,.7,.45,.6,.75,.5];
  const clean=cPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#378ADD" opacity="0.75"/>`).join('');
  const noisy=nPts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="2" fill="#D85A30" class="ndot" style="animation-delay:${(i*0.06).toFixed(2)}s;opacity:${opac[i]||0.6}"/>`).join('');
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 232">
<rect x="48" y="16" width="272" height="176" rx="8" fill="#E8F4FD" stroke="#B5D4F4" stroke-width="0.5"/>
<rect x="58" y="24" width="28" height="16" rx="3" fill="#B5D4F4"/>
<text x="72" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#0C447C">SIM</text>
<rect x="360" y="16" width="272" height="176" rx="8" fill="#FDF4E8" stroke="#EF9F27" stroke-width="0.5"/>
<rect x="370" y="24" width="30" height="16" rx="3" fill="#FAC775"/>
<text x="385" y="32" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#633806">REAL</text>
<text x="340" y="108" text-anchor="middle" font-size="22" fill="var(--color-border-secondary)">&#8800;</text>
<rect x="96" y="68" width="144" height="104" rx="3" fill="none" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 3"/>
${clean}
<text x="168" y="60" text-anchor="middle" font-size="10" fill="#185FA5">depth scan — perfect grid</text>
<text x="168" y="182" text-anchor="middle" font-size="10" fill="#185FA5">±0 mm noise</text>
<rect x="422" y="62" width="194" height="116" rx="3" fill="none" stroke="#FAC775" stroke-width="0.5" stroke-dasharray="4 3"/>
${noisy}
<text x="519" y="54" text-anchor="middle" font-size="10" fill="#993C1D">point cloud — scattered</text>
<text x="519" y="188" text-anchor="middle" font-size="10" fill="#993C1D">±8–15 mm per point</text>
<text x="340" y="212" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Sim sensors return exact values. Real sensors add Gaussian noise that compounds into failures.</text>
</svg>`;
}

function s5(el){
  const envs=[
    {bk:'#E8F4FD',cf:'#378ADD',cs:'#185FA5',lb:'random textures'},
    {bk:'#EAF3DE',cf:'#639922',cs:'#3B6D11',lb:'varied lighting'},
    {bk:'#FEF3E2',cf:'#BA7517',cs:'#854F0B',lb:'physics noise'},
    {bk:'#F3EFFE',cf:'#7F77DD',cs:'#534AB7',lb:'random cameras'},
  ];
  const W=148,H=88;
  const pos=[{x:30,y:18},{x:192,y:18},{x:30,y:120},{x:192,y:120}];
  const boxes=envs.map(({bk,cf,cs,lb},i)=>{
    const {x,y}=pos[i];
    return `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="6" fill="${bk}" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<rect x="${x+34}" y="${y+H-36}" width="44" height="28" rx="2" fill="${cf}" stroke="${cs}" stroke-width="0.5"/>
<rect x="${x+10}" y="${y+H-8}" width="${W-20}" height="5" rx="1" fill="var(--color-border-secondary)"/>
<text x="${x+W/2}" y="${y+13}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--color-text-tertiary)">${lb}</text>`;
  }).join('');
  el.innerHTML=`<svg width="100%" viewBox="0 0 680 232">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="180" y="12" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-secondary)">randomized sim variants</text>
${boxes}
<line x1="344" y1="62" x2="390" y2="100" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="344" y1="164" x2="390" y2="120" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="394" y="18" width="244" height="182" rx="8" fill="#FDF4E8" stroke="#EF9F27" stroke-width="0.5"/>
<rect x="404" y="28" width="30" height="16" rx="3" fill="#FAC775"/>
<text x="419" y="36" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="#633806">REAL</text>
<rect x="454" y="138" width="124" height="8" rx="1" fill="#B4A898"/>
<ellipse cx="516" cy="140" rx="28" ry="5" fill="rgba(0,0,0,0.08)"/>
<rect x="488" y="96" width="56" height="42" rx="3" fill="#8B6E4E" stroke="#633806" stroke-width="0.5"/>
<rect x="408" y="162" width="222" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="519" y="175" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#27500A">policy transfers successfully</text>
<text x="340" y="216" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Diversity during training builds robustness. The real world becomes just another variation.</text>
</svg>`;
}
vr();vstrt();
</script>
</body>
</html>
