<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLAM — Mapping the Unknown</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:24px 32px;margin:0;min-height:100vh}

.header{text-align:center;margin-bottom:20px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#e6edf3,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.header p{color:#8b949e;font-size:13px}

.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.step-dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#30363d;cursor:pointer;border:none;padding:0;transition:all 0.2s}
.dot.active{background:#58a6ff;box-shadow:0 0 8px rgba(88,166,255,0.4)}
.nav-btn{background:none;border:1px solid #30363d;color:#8b949e;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.nav-btn:hover{border-color:#58a6ff;color:#58a6ff}
.play-btn{background:none;border:1px solid #30363d;color:#8b949e;border-radius:6px;height:32px;padding:0 12px;cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.15s}
.play-btn:hover{border-color:#58a6ff;color:#58a6ff}
.play-btn.playing{border-color:#1D9E75;color:#1D9E75}

.step-info{text-align:center;margin-bottom:16px;min-height:52px}
.step-title{font-size:16px;font-weight:600;margin-bottom:4px;color:#e6edf3}
.step-desc{font-size:13px;color:#8b949e;max-width:600px;margin:0 auto;line-height:1.5}

.canvas-wrap{display:flex;justify-content:center}
.canvas-wrap svg{max-width:100%;height:auto;opacity:0;transition:opacity 0.4s ease}
.canvas-wrap svg.visible{opacity:1}

.progress{height:2px;background:#1c2333;border-radius:1px;overflow:hidden;max-width:500px;margin:0 auto 12px}
.progress-fill{height:100%;background:#58a6ff;transition:width 0.3s ease}
</style>
</head>
<body>

<div class="header">
  <h1>SLAM — Mapping the Unknown</h1>
  <p>How robots simultaneously build a map and figure out where they are in it</p>
</div>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<div class="controls">
  <button class="nav-btn" onclick="navigate(-1)">&#8249;</button>
  <div class="step-dots" id="dots"></div>
  <button class="nav-btn" onclick="navigate(1)">&#8250;</button>
  <button class="play-btn" id="play-btn" onclick="togglePlay()">&#9654; Auto</button>
</div>

<div class="step-info">
  <div class="step-title" id="step-title"></div>
  <div class="step-desc" id="step-desc"></div>
</div>

<div class="canvas-wrap">
  <svg id="viz" viewBox="0 0 700 360" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
const STEPS = [
  {
    title: 'Step 1: The Chicken-and-Egg Problem',
    desc: 'A robot enters an unknown space with no map and no GPS. To navigate, it needs a map. To build a map, it needs to know where it is. SLAM solves both at the same time.',
  },
  {
    title: 'Step 2: Extract Visual Landmarks',
    desc: 'The camera captures frames and a feature detector (ORB, SIFT, SuperPoint) finds distinctive keypoints — corners, edges, blobs — that can be recognized from different angles.',
  },
  {
    title: 'Step 3: Track Motion Frame-to-Frame',
    desc: 'By matching the same landmarks across consecutive frames, the system estimates how the camera moved. This visual odometry gives a running estimate of position and orientation.',
  },
  {
    title: 'Step 4: Build the Map Incrementally',
    desc: 'Each new observation adds landmarks to a growing 3D map. The robot\'s trajectory and all landmark positions are stored in a pose graph — a web of spatial relationships.',
  },
  {
    title: 'Step 5: Loop Closure Fixes Drift',
    desc: 'Small errors accumulate over time (drift). When the robot recognizes a place it visited before, it triggers loop closure — snapping the entire map into alignment and correcting all past poses at once.',
  },
];

let current = 0;
let autoTimer = null;
let playing = false;

const dotsEl = document.getElementById('dots');
STEPS.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => { stopPlay(); goTo(i); };
  dotsEl.appendChild(d);
});

function navigate(dir) {
  stopPlay();
  goTo(Math.max(0, Math.min(STEPS.length - 1, current + dir)));
}

function togglePlay() {
  if (playing) { stopPlay(); return; }
  playing = true;
  document.getElementById('play-btn').innerHTML = '&#9208; Pause';
  document.getElementById('play-btn').classList.add('playing');
  advanceAuto();
}

function stopPlay() {
  playing = false;
  clearTimeout(autoTimer);
  document.getElementById('play-btn').innerHTML = '&#9654; Auto';
  document.getElementById('play-btn').classList.remove('playing');
}

function advanceAuto() {
  if (!playing) return;
  const next = (current + 1) % STEPS.length;
  goTo(next);
  autoTimer = setTimeout(advanceAuto, 5000);
}

function goTo(idx) {
  current = idx;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById('step-title').textContent = STEPS[idx].title;
  document.getElementById('step-desc').textContent = STEPS[idx].desc;
  document.getElementById('progress').style.width = ((idx + 1) / STEPS.length * 100) + '%';

  const svg = document.getElementById('viz');
  svg.classList.remove('visible');
  setTimeout(() => {
    renderStep(idx);
    svg.classList.add('visible');
  }, 200);
}

function renderStep(step) {
  const svg = document.getElementById('viz');

  // Reusable robot icon
  const robot = (color = '#58a6ff') => `
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#1c2333" stroke="${color}" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="3" fill="${color}" opacity="0.8"/>
    <circle cx="18" cy="10" r="3" fill="${color}" opacity="0.8"/>
    <rect x="5" y="20" width="6" height="4" rx="1" fill="#30363d"/>
    <rect x="17" y="20" width="6" height="4" rx="1" fill="#30363d"/>
  `;

  // Room walls helper
  const room = () => `
    <rect x="0" y="0" width="300" height="220" rx="4" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <!-- Walls / obstacles -->
    <rect x="90" y="0" width="8" height="80" rx="1" fill="#30363d" stroke="#484f58" stroke-width="0.5"/>
    <rect x="180" y="60" width="8" height="100" rx="1" fill="#30363d" stroke="#484f58" stroke-width="0.5"/>
    <rect x="0" y="140" width="60" height="8" rx="1" fill="#30363d" stroke="#484f58" stroke-width="0.5"/>
    <rect x="220" y="0" width="8" height="50" rx="1" fill="#30363d" stroke="#484f58" stroke-width="0.5"/>
    <!-- Furniture blobs -->
    <rect x="120" y="15" width="35" height="25" rx="3" fill="#1c2333" stroke="#484f58" stroke-width="0.5"/>
    <circle cx="250" cy="90" r="16" fill="#1c2333" stroke="#484f58" stroke-width="0.5"/>
    <rect x="30" y="170" width="40" height="30" rx="3" fill="#1c2333" stroke="#484f58" stroke-width="0.5"/>
  `;

  if (step === 0) {
    svg.innerHTML = `
      <!-- Left: the paradox -->
      <text x="350" y="28" text-anchor="middle" font-size="12" fill="#D85A30" font-weight="600">The Simultaneous Localization and Mapping Problem</text>

      <!-- Need map to localize -->
      <g transform="translate(40,55)">
        <rect x="0" y="0" width="260" height="100" rx="8" fill="#161b22" stroke="#D85A30" stroke-width="1.2"/>
        <text x="130" y="24" text-anchor="middle" font-size="11" fill="#D85A30" font-weight="600">To know WHERE I am...</text>
        <text x="130" y="46" text-anchor="middle" font-size="10" fill="#8b949e">I need a map of the environment</text>
        <!-- Empty map -->
        <g transform="translate(75,55)">
          <rect x="0" y="0" width="110" height="35" rx="4" fill="#1c2333" stroke="#484f58" stroke-width="0.8" stroke-dasharray="4 2"/>
          <text x="55" y="22" text-anchor="middle" font-size="10" fill="#484f58">no map exists</text>
        </g>
      </g>

      <!-- Need position to map -->
      <g transform="translate(390,55)">
        <rect x="0" y="0" width="260" height="100" rx="8" fill="#161b22" stroke="#A371F7" stroke-width="1.2"/>
        <text x="130" y="24" text-anchor="middle" font-size="11" fill="#A371F7" font-weight="600">To BUILD a map...</text>
        <text x="130" y="46" text-anchor="middle" font-size="10" fill="#8b949e">I need to know where I am</text>
        <!-- Unknown position -->
        <g transform="translate(75,55)">
          <rect x="0" y="0" width="110" height="35" rx="4" fill="#1c2333" stroke="#484f58" stroke-width="0.8" stroke-dasharray="4 2"/>
          <text x="55" y="22" text-anchor="middle" font-size="10" fill="#484f58">position unknown</text>
        </g>
      </g>

      <!-- Circular arrows -->
      <g transform="translate(310,80)">
        <path d="M0,0 Q40,-25 70,0" stroke="#6e7681" stroke-width="1.5" fill="none"/>
        <polygon points="68,-3 75,0 68,3" fill="#6e7681"/>
        <path d="M70,40 Q30,65 0,40" stroke="#6e7681" stroke-width="1.5" fill="none"/>
        <polygon points="2,43 -5,40 2,37" fill="#6e7681"/>
        <text x="35" y="28" text-anchor="middle" font-size="8" fill="#6e7681">depends on</text>
      </g>

      <!-- SLAM solution -->
      <g transform="translate(140,190)">
        <rect x="0" y="0" width="420" height="90" rx="10" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="210" y="24" text-anchor="middle" font-size="13" fill="#1D9E75" font-weight="700">SLAM: Solve Both Simultaneously</text>
        <text x="210" y="46" text-anchor="middle" font-size="10" fill="#8b949e">Use each new observation to BOTH refine the map AND update position.</text>
        <text x="210" y="66" text-anchor="middle" font-size="10" fill="#8b949e">The map helps localize. Localization helps map. They bootstrap each other.</text>
      </g>

      <!-- Robot -->
      <g transform="translate(336,295)">
        ${robot('#58a6ff')}
        <!-- Question marks -->
        <text x="-8" y="-4" font-size="12" fill="#D85A30" opacity="0.6">?</text>
        <text x="30" y="-4" font-size="12" fill="#A371F7" opacity="0.6">?</text>
      </g>
      <text x="350" y="345" text-anchor="middle" font-size="10" fill="#484f58">one of the most fundamental problems in all of robotics</text>
    `;
  }

  else if (step === 1) {
    svg.innerHTML = `
      <!-- Camera view -->
      <g transform="translate(20,40)">
        <rect x="0" y="0" width="220" height="160" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
        <text x="110" y="20" text-anchor="middle" font-size="10" fill="#58a6ff" font-weight="600">Camera Frame</text>

        <!-- Scene elements -->
        <rect x="15" y="35" width="60" height="80" rx="2" fill="#1c2333" stroke="#484f58" stroke-width="0.8"/>
        <text x="45" y="80" text-anchor="middle" font-size="8" fill="#6e7681">door</text>
        <rect x="90" y="55" width="40" height="60" rx="2" fill="#1c2333" stroke="#484f58" stroke-width="0.8"/>
        <text x="110" y="90" text-anchor="middle" font-size="8" fill="#6e7681">chair</text>
        <rect x="150" y="40" width="50" height="75" rx="2" fill="#1c2333" stroke="#484f58" stroke-width="0.8"/>
        <text x="175" y="82" text-anchor="middle" font-size="8" fill="#6e7681">wall</text>

        <!-- Keypoints detected -->
        <circle cx="15" cy="35" r="4" fill="#D85A30" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="75" cy="35" r="4" fill="#D85A30" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.2s"/>
        </circle>
        <circle cx="75" cy="115" r="4" fill="#D85A30" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.4s"/>
        </circle>
        <circle cx="90" cy="55" r="4" fill="#1D9E75" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.1s"/>
        </circle>
        <circle cx="130" cy="55" r="4" fill="#1D9E75" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
        <circle cx="130" cy="115" r="4" fill="#1D9E75" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
        <circle cx="150" cy="40" r="4" fill="#A371F7" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.15s"/>
        </circle>
        <circle cx="200" cy="40" r="4" fill="#A371F7" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.35s"/>
        </circle>
        <circle cx="150" cy="115" r="4" fill="#A371F7" opacity="0.8">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
        </circle>

        <text x="110" y="145" text-anchor="middle" font-size="9" fill="#D85A30">keypoints detected: corners, edges, blobs</text>
      </g>

      <!-- Arrow -->
      <line x1="248" y1="120" x2="288" y2="120" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="288,117 294,120 288,123" fill="#484f58"/>

      <!-- Feature Detector -->
      <g transform="translate(300,55)">
        <rect x="0" y="0" width="140" height="130" rx="10" fill="#161b22" stroke="#A371F7" stroke-width="1.5"/>
        <text x="70" y="22" text-anchor="middle" font-size="10" fill="#A371F7" font-weight="600">Feature Detector</text>
        <text x="70" y="40" text-anchor="middle" font-size="9" fill="#6e7681">ORB / SuperPoint</text>

        <!-- Feature descriptor visualization -->
        <g transform="translate(15,52)">
          <rect x="0" y="0" width="110" height="60" rx="4" fill="#1c2333"/>
          <!-- Grid of feature values -->
          <g font-size="6" fill="#A371F7" opacity="0.6">
            <text x="8" y="12">0.9</text><text x="30" y="12">0.1</text><text x="52" y="12">0.7</text><text x="74" y="12">0.3</text><text x="96" y="12">0.8</text>
            <text x="8" y="26">0.2</text><text x="30" y="26">0.8</text><text x="52" y="26">0.4</text><text x="74" y="26">0.9</text><text x="96" y="26">0.1</text>
            <text x="8" y="40">0.6</text><text x="30" y="40">0.3</text><text x="52" y="40">0.9</text><text x="74" y="40">0.2</text><text x="96" y="40">0.7</text>
            <text x="8" y="54">0.4</text><text x="30" y="54">0.7</text><text x="52" y="54">0.1</text><text x="74" y="54">0.6</text><text x="96" y="54">0.5</text>
          </g>
        </g>
      </g>

      <!-- Arrow -->
      <line x1="445" y1="120" x2="485" y2="120" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="485,117 491,120 485,123" fill="#484f58"/>

      <!-- Output: Landmark descriptors -->
      <g transform="translate(495,45)">
        <rect x="0" y="0" width="175" height="150" rx="8" fill="#161b22" stroke="#1D9E75" stroke-width="1.2"/>
        <text x="87" y="22" text-anchor="middle" font-size="10" fill="#1D9E75" font-weight="600">Landmarks</text>

        <g transform="translate(12,35)">
          <circle cx="10" cy="8" r="5" fill="#D85A30" opacity="0.7"/>
          <text x="25" y="12" font-size="8" fill="#8b949e">corner_1 [0.9, 0.1, ...]</text>
          <circle cx="10" cy="30" r="5" fill="#D85A30" opacity="0.7"/>
          <text x="25" y="34" font-size="8" fill="#8b949e">corner_2 [0.2, 0.8, ...]</text>
          <circle cx="10" cy="52" r="5" fill="#1D9E75" opacity="0.7"/>
          <text x="25" y="56" font-size="8" fill="#8b949e">edge_1 [0.6, 0.3, ...]</text>
          <circle cx="10" cy="74" r="5" fill="#1D9E75" opacity="0.7"/>
          <text x="25" y="78" font-size="8" fill="#8b949e">edge_2 [0.4, 0.9, ...]</text>
          <circle cx="10" cy="96" r="5" fill="#A371F7" opacity="0.7"/>
          <text x="25" y="100" font-size="8" fill="#8b949e">blob_1 [0.7, 0.2, ...]</text>
        </g>
      </g>

      <!-- Insight -->
      <g transform="translate(80,230)">
        <rect x="0" y="0" width="540" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="270" y="20" text-anchor="middle" font-size="11" fill="#58a6ff" font-weight="600">Each landmark gets a unique descriptor</text>
        <text x="270" y="40" text-anchor="middle" font-size="10" fill="#8b949e">a numerical fingerprint that can be recognized even from different viewpoints and lighting</text>
      </g>

      <text x="350" y="340" text-anchor="middle" font-size="10" fill="#484f58">good features are viewpoint-invariant, repeatable, and fast to compute</text>
    `;
  }

  else if (step === 2) {
    svg.innerHTML = `
      <text x="350" y="28" text-anchor="middle" font-size="12" fill="#58a6ff" font-weight="600">Visual Odometry: Estimating Motion from Feature Matches</text>

      <!-- Frame t -->
      <g transform="translate(30,50)">
        <rect x="0" y="0" width="180" height="130" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
        <text x="90" y="18" text-anchor="middle" font-size="9" fill="#6e7681">frame t</text>
        <!-- Keypoints -->
        <circle cx="40" cy="45" r="5" fill="#D85A30" opacity="0.8"/>
        <circle cx="100" cy="40" r="5" fill="#1D9E75" opacity="0.8"/>
        <circle cx="145" cy="55" r="5" fill="#A371F7" opacity="0.8"/>
        <circle cx="60" cy="85" r="5" fill="#E3B341" opacity="0.8"/>
        <circle cx="130" cy="95" r="5" fill="#58a6ff" opacity="0.8"/>
        <circle cx="80" cy="110" r="5" fill="#D85A30" opacity="0.6"/>
      </g>

      <!-- Frame t+1 -->
      <g transform="translate(280,50)">
        <rect x="0" y="0" width="180" height="130" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
        <text x="90" y="18" text-anchor="middle" font-size="9" fill="#58a6ff">frame t+1</text>
        <!-- Same keypoints, shifted -->
        <circle cx="55" cy="50" r="5" fill="#D85A30" opacity="0.8"/>
        <circle cx="115" cy="44" r="5" fill="#1D9E75" opacity="0.8"/>
        <circle cx="158" cy="58" r="5" fill="#A371F7" opacity="0.8"/>
        <circle cx="75" cy="88" r="5" fill="#E3B341" opacity="0.8"/>
        <circle cx="142" cy="98" r="5" fill="#58a6ff" opacity="0.8"/>
        <circle cx="95" cy="113" r="5" fill="#D85A30" opacity="0.6"/>
      </g>

      <!-- Match lines -->
      <line x1="70" y1="95" x2="335" y2="100" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="130" y1="90" x2="395" y2="94" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.2s"/>
      </line>
      <line x1="175" y1="105" x2="438" y2="108" stroke="#A371F7" stroke-width="1.2" stroke-dasharray="4 2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      </line>
      <line x1="90" y1="135" x2="355" y2="138" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="4 2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.1s"/>
      </line>
      <line x1="160" y1="145" x2="422" y2="148" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </line>

      <!-- Arrow to result -->
      <line x1="465" y1="115" x2="500" y2="115" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
      <polygon points="500,112 506,115 500,118" fill="#484f58"/>

      <!-- Motion estimate -->
      <g transform="translate(510,55)">
        <rect x="0" y="0" width="160" height="130" rx="8" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
        <text x="80" y="22" text-anchor="middle" font-size="10" fill="#1D9E75" font-weight="600">Motion Estimate</text>

        <!-- Translation -->
        <text x="15" y="48" font-size="9" fill="#8b949e">translation:</text>
        <text x="15" y="64" font-size="10" fill="#1D9E75" font-weight="600">dx=+3cm  dy=+1cm</text>

        <!-- Rotation -->
        <text x="15" y="88" font-size="9" fill="#8b949e">rotation:</text>
        <text x="15" y="104" font-size="10" fill="#A371F7" font-weight="600">&#952; = +2.3&#176;</text>

        <text x="80" y="124" text-anchor="middle" font-size="8" fill="#6e7681">from matched features</text>
      </g>

      <!-- Insight -->
      <g transform="translate(60,210)">
        <rect x="0" y="0" width="580" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="290" y="20" text-anchor="middle" font-size="11" fill="#58a6ff" font-weight="600">Epipolar geometry recovers 3D motion from 2D correspondences</text>
